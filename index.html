function damageEnemy(e, amount, fromX, fromY, isFire, ignoreArmor) {
  let dmg = amount;
  if (isFire && e.isBoss) dmg = Math.floor(dmg * 0.5);
  let real;
  if (ignoreArmor) real = Math.max(1, dmg);
  else real = Math.max(1, dmg - (e.armor || 0));
  e.hp -= real; e.hitFlash = 6;
  if (!isFire) burst(e.x, e.y - (e.airHeight || 0), 5, { speed: 2, life: 12, size: 1.5, color: e.isAir ? AIR : GREEN_BRIGHT });
  addText(e.x, e.y - (e.airHeight || 0) - e.size - 5, '-' + real, isFire ? FIRE_BRIGHT : (e.isAir ? AIR : GREEN_BRIGHT), 30, e.isBoss ? 18 : 14);
  if (fromX !== undefined && fromY !== undefined) addSpark(fromX, fromY, e.x, e.y - (e.airHeight || 0), e.isAir ? AIR : GREEN_BRIGHT);

  if (e.isBoss && e.type === 'ogro') {
    const hpLost = e.maxHp - e.hp;
    const poundsExpected = Math.floor(hpLost / e.poundThreshold);
    const poundsDone = Math.floor((e.maxHp - e.lastPoundHp) / e.poundThreshold);
    if (poundsExpected > poundsDone) {
      e.lastPoundHp = e.maxHp - poundsExpected * e.poundThreshold;
      ogroPound(e.x, e.y);
    }
  }
}

function applyFire(e, fireDmg, fireDur) {
  if (e.isAir) return;
  if (e.isBoss && e.fireTimer > 0) return;
  e.fireTimer = fireDur || 300;
  e.fireTickTimer = 0;
  e.fireDmg = fireDmg || 10;
}
function applyIce(e, iceDur) {
  if (e.isAir) return;
  if (e.isBoss) return;
  if (e.type === 'yeti') return;
  if (e.type === 'blindado') { e.iceFrozen = Math.floor((iceDur || 90) * 0.5); return; }
  e.iceFrozen = iceDur || 90;
}

function bazookaExplosion(x, y, damage, radius, extraSplash) {
  addShockwave(x, y, ORANGE, radius, 22);
  addShockwave(x, y, YELLOW, radius * 0.7, 16);
  burst(x, y, 50, { speed: 7, life: 40, size: 3, gravity: 0.15, friction: 0.9 });
  burst(x, y, 25, { speed: 11, life: 25, size: 2, color: YELLOW, friction: 0.88 });
  addFlash(0.55); addShake(9);
  Sound.explosion();
  const inRange = enemies.filter(e => Math.hypot(e.x - x, (e.y - (e.airHeight || 0)) - y) <= radius);
  for (const e of inRange) {
    const dist = Math.hypot(e.x - x, (e.y - (e.airHeight || 0)) - y);
    const falloff = 1 - (dist / radius) * 0.6;
    damageEnemy(e, Math.floor(damage * falloff));
  }
  // ⭐3: segundo míssil divide
  if (extraSplash) {
    const offsetX = x + (Math.random() - 0.5) * radius;
    const offsetY = y + (Math.random() - 0.5) * radius;
    setTimeout(() => {
      addShockwave(offsetX, offsetY, ORANGE, radius * 0.7, 18);
      burst(offsetX, offsetY, 25, { speed: 5, life: 30, size: 3, color: ORANGE });
      const inRange2 = enemies.filter(e => Math.hypot(e.x - offsetX, (e.y - (e.airHeight || 0)) - offsetY) <= radius * 0.7);
      for (const e of inRange2) {
        damageEnemy(e, Math.floor(damage * 0.6));
      }
    }, 200);
  }
}

function findCorrectWaypointForPosition(x, y) {
  let bestSegIdx = 0, bestDist = Infinity;
  for (let i = 0; i < path.length - 1; i++) {
    const d = distToSegment({x, y}, path[i], path[i+1]);
    if (d < bestDist) { bestDist = d; bestSegIdx = i; }
  }
  return Math.min(bestSegIdx + 1, path.length - 1);
}

function spawnCloneMinions(x, y, parentWp) {
  const parentAngle = parentWp < path.length
    ? Math.atan2(path[parentWp].y - path[parentWp - 1].y, path[parentWp].x - path[parentWp - 1].x) : 0;
  for (let i = 0; i < 5; i++) {
    const spreadAngle = (Math.PI * 2 / 5) * i;
    const offsetAngle = parentAngle + Math.PI / 2;
    const perpX = Math.cos(offsetAngle) * 18 * Math.cos(spreadAngle);
    const perpY = Math.sin(offsetAngle) * 18 * Math.cos(spreadAngle);
    const fwdX = Math.cos(parentAngle) * 18 * Math.sin(spreadAngle);
    const fwdY = Math.sin(parentAngle) * 18 * Math.sin(spreadAngle);
    const mx = x + perpX + fwdX, my = y + perpY + fwdY;
    const wp = findCorrectWaypointForPosition(mx, my);
    spawnEnemy('minion', mx, my, wp);
  }
  addShockwave(x, y, CYAN, 40, 22);
  burst(x, y, 20, { speed: 4, life: 30, color: CYAN, size: 2 });
  addFlash(0.2);
}

function spawnFungusZone(x, y) {
  healZones.push({ x, y, radius: 8 * PPM, life: 4 * 60, maxLife: 4 * 60, pulse: 0 });
  addShockwave(x, y, TOXIC, 8 * PPM, 45);
  burst(x, y, 25, { speed: 4, life: 40, size: 3, color: TOXIC, gravity: 0.05 });
  addFlash(0.15, '102,255,51');
}

let lastTime = 0;
function loop(time) {
  requestAnimationFrame(loop);
  if (!gameMode) return;
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;

  if (paused || gameOver) { draw(); return; }

  if (waveActive && waveQueue.length > 0) {
    spawnCooldown -= dt;
    if (spawnCooldown <= 0) {
      spawnEnemy(waveQueue.shift());
      spawnCooldown = 45;
    }
  } else if (waveActive && waveQueue.length === 0 && enemies.length === 0 && !isBossWave(waveNum)) {
    waveActive = false; waveDelay = 90;
  } else if (waveActive && isBossWave(waveNum) && enemies.length === 0) {
    waveActive = false; bossActive = false; bossRef = null; waveDelay = 120;
  }
  if (waveDelay > 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) startWave();
  }

  for (const t of towers) {
    t.frozenByYeti = false; t.isProtected = false;
    if (t.punchAnim > 0) t.punchAnim -= dt * 2;
    if (t.isDrone) t.droneRotorAngle += dt * 0.8;
  }

  for (const t of towers) {
    if (t.isDefensor) {
      t.defensorPulse = (t.defensorPulse || 0) + dt * 0.08;
      for (const o of towers) {
        if (Math.hypot(o.x - t.x, o.y - t.y) <= t.range) {
          o.isProtected = true;
          o.protReduction = t.reduction;
        }
      }
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.spawnAnim > 0) e.spawnAnim -= dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;

    if (e.iceFrozen > 0) {
      e.iceFrozen -= dt;
      if (Math.random() < 0.3) {
        addParticle(e.x + (Math.random() - 0.5) * e.size, e.y + (Math.random() - 0.5) * e.size, {
          vx: 0, vy: -0.4, life: 20, size: 2, color: FROZEN, friction: 0.97
        });
      }
      continue;
    }

    let frozenByParadox = false;
    for (const z of paradoxZones) {
      if (Math.hypot(e.x - z.x, e.y - z.y) <= z.radius) { frozenByParadox = true; break; }
    }

    if (e.isBoss) {
      e.stepTimer -= dt;
      if (e.stepTimer <= 0) {
        e.stepTimer = 120;
        addShake(0.8);
        for (let k = 0; k < 6; k++) {
          addParticle(e.x + (Math.random() - 0.5) * e.size, e.y + e.size/2 + Math.random() * 6, {
            vx: (Math.random() - 0.5) * 1, vy: -0.5 - Math.random() * 0.5,
            life: 60, size: 3, color: Math.random() < 0.5 ? OGRE : ORANGE, friction: 0.95
          });
        }
      }
    }

    if (e.isAir) {
      e.airBob += dt * 0.1;
      e.airPropTimer -= dt;
      if (e.airPropTimer <= 0 && !frozenByParadox) {
        e.airPropTimer = 4;
        addAirTrail(e.x, e.y - 2);
        if (Math.random() < 0.5) {
          addParticle(e.x + (Math.random() - 0.5) * 8, e.y - 2, {
            vx: (Math.random() - 0.5) * 0.3, vy: 1 + Math.random() * 0.5,
            life: 15, size: 2, color: AIR, friction: 0.97
          });
        }
      }
    }

    if (e.aura > 0) {
      for (const t of towers) {
        if (t.isGlacial) continue;
        if (Math.hypot(t.x - e.x, t.y - e.y) <= e.aura) t.frozenByYeti = true;
      }
      if (Math.random() < 0.15) {
        const angle = Math.random() * Math.PI * 2;
        const r = e.aura * (0.5 + Math.random() * 0.5);
        addParticle(e.x + Math.cos(angle) * r, e.y + Math.sin(angle) * r, {
          vx: (Math.random() - 0.5) * 0.5, vy: -0.5 - Math.random() * 0.5,
          life: 30, size: 2, color: ICE, friction: 0.97
        });
      }
    }

    if (e.fireTimer > 0) {
      e.fireTimer -= dt;
      e.fireTickTimer += dt;
      addFireParticle(e);
      if (e.fireTickTimer >= 60) {
        e.fireTickTimer -= 60;
        damageEnemy(e, e.fireDmg || 10, undefined, undefined, true, e.fireIgnoresArmor);
      }
      if (e.fireTimer <= 0) e.fireTimer = 0;
    }

    if (!frozenByParadox) {
      const target = path[e.wp];
      if (!target) {
        damagePlayer(e.damage);
        burst(e.x, e.y - (e.airHeight || 0), 14, { speed: 4, life: 22, size: 2, color: RED });
        addShockwave(e.x, e.y - (e.airHeight || 0), RED, 30, 18);
        if (e.isBoss) { addShake(10); addFlash(0.5, '102,255,51'); }
        enemies.splice(i, 1); continue;
      }
      e.lastTrailTime -= dt;
      if (e.lastTrailTime <= 0 && e.baseSpeed > 0.5 && !e.isAir) {
        const trailCol = e.isBoss ? OGRE : GREEN;
        addTrail(e.x, e.y, trailCol, e.size * 0.5, 10);
        e.lastTrailTime = 4;
      }
      const dx = target.x - e.x, dy = target.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist < e.speed * dt) { e.x = target.x; e.y = target.y; e.wp++; }
      else { e.x += (dx/dist) * e.speed * dt; e.y += (dy/dist) * e.speed * dt; }
    }

    if (e.hp <= 0) {
      gold += e.reward;
      const deathCol = e.isBoss ? OGRE : (e.type === 'yeti' ? ICE : (e.isAir ? AIR : GREEN));
      addShockwave(e.x, e.y - (e.airHeight || 0), deathCol, 25, 15);
      burst(e.x, e.y - (e.airHeight || 0), e.isBoss ? 40 : 12, {
        speed: 3, life: 22, size: e.isBoss ? 4 : 2, color: deathCol
      });
      addText(e.x, e.y - (e.airHeight || 0) - e.size - 5, '+' + e.reward, YELLOW, 40, e.isBoss ? 26 : 14);
      if (!e.isBoss) Sound.enemyDeath();
      if (e.onDeath === 'clone') spawnCloneMinions(e.x, e.y, e.wp);
      else if (e.onDeath === 'explode') areaExplosion(e.x, e.y, 50, 4 * PPM);
      else if (e.onDeath === 'fungusZone') spawnFungusZone(e.x, e.y);
      if (e.isBoss) {
        bossFinalExplosion(e.x, e.y);
        bossRef = null;
        healPlayer(50);
        // CRISTAIS
        const crystalReward = getBossCrystalReward(waveNum);
        crystals += crystalReward;
        runCrystalsEarned += crystalReward;
        saveCrystals(crystals);
        addCrystalPop(e.x, e.y - 40, crystalReward);
        Sound.crystal();
        showMsg('> OGRO DERROTADO! +' + crystalReward + ' 💎');
        updateMenuCrystals();
      }
      enemies.splice(i, 1);
      updateUI();
    }
  }

  for (let i = healZones.length - 1; i >= 0; i--) {
    const z = healZones[i];
    z.life -= dt; z.pulse += dt * 0.15;
    if (z.life <= 0) { healZones.splice(i, 1); continue; }
    for (const e of enemies) {
      const d = Math.hypot(e.x - z.x, (e.y - (e.airHeight || 0)) - z.y);
      if (d <= z.radius) {
        const healThisFrame = 10 / 60 * dt;
        e.hp = Math.min(e.maxHp, e.hp + healThisFrame);
        e.lastHealTick = (e.lastHealTick || 0) + dt;
        if (e.lastHealTick >= 60 && e.hp < e.maxHp) { addEnemyHealEffect(e.x, e.y - (e.airHeight || 0), 10); e.lastHealTick = 0; }
        if (e.hp >= e.maxHp) e.lastHealTick = 0;
      } else e.lastHealTick = 0;
    }
  }

  for (let i = paradoxZones.length - 1; i >= 0; i--) {
    const z = paradoxZones[i];
    z.life -= dt;
    z.pulse = (z.pulse || 0) + dt * 0.1;
    if (z.life <= 0) paradoxZones.splice(i, 1);
  }

  for (const t of towers) {
    if (t.spawnAnim > 0) t.spawnAnim -= dt;
    if (t.recoil > 0) t.recoil -= dt * 3;
    if (t.healPulse > 0) t.healPulse -= dt * 2;
    if (t.incomePulse > 0) t.incomePulse -= dt * 2;

    let cooldownSpeed = 1;
    if (t.frozenByYeti) {
      let mult = 3;
      for (const e of enemies) {
        if (e.aura > 0 && Math.hypot(t.x - e.x, t.y - e.y) <= e.aura) {
          if (e.isBoss) mult = Math.min(mult, 2);
        }
      }
      cooldownSpeed = 1 / mult;
    }
    t.cooldown -= dt * cooldownSpeed;

    if (t.isHealer) {
      if (t.cooldown <= 0) {
        const targets = towers.filter(o => Math.hypot(o.x - t.x, o.y - t.y) <= t.range);
        let healedAny = false;
        for (const o of targets) {
          if (o.hp < o.maxHp) {
            const healed = Math.min(t.heal, o.maxHp - o.hp);
            o.hp += healed;
            if (healed > 0) { addHealEffect(o.x, o.y, t.heal); healedAny = true; }
          }
        }
        // ⭐3: médico cura jogador
        if (t.starLevel >= 3) {
          healPlayer(5);
        }
        if (healedAny) { addShockwave(t.x, t.y, GREEN_BRIGHT, t.range, 30); t.healPulse = 1; Sound.heal(); updateUI(); }
        t.cooldown = t.fireRate;
      }
      continue;
    }

    if (t.isMerchant) {
      if (t.cooldown <= 0) {
        gold += t.income;
        addMoneyPop(t.x, t.y - 15, t.income);
        addShockwave(t.x, t.y, GOLD, 35, 25);
        burst(t.x, t.y, 12, { speed: 2, life: 35, color: GOLD, size: 2 });
        t.incomePulse = 1;
        Sound.coin();
        updateUI(); t.cooldown = t.fireRate;
      }
      // ⭐3: cristal a cada 20s (limite 5 por partida por comerciante)
      if (t.starLevel >= 3) {
        t.merchantCrystalTimer = (t.merchantCrystalTimer || 0) + dt;
        if (t.merchantCrystalTimer >= 1200 && (t.crystalsGiven || 0) < 5) {
          t.merchantCrystalTimer = 0;
          t.crystalsGiven = (t.crystalsGiven || 0) + 1;
          crystals += 1;
          runCrystalsEarned += 1;
          saveCrystals(crystals);
          addCrystalPop(t.x, t.y - 25, 1);
          Sound.crystal();
          updateMenuCrystals();
        }
      }
      continue;
    }

    if (t.isDefensor) {
      t.cooldown = t.fireRate;
      // ⭐3: regenera tropas
      if (t.starLevel >= 3) {
        t.hp = Math.min(t.maxHp, t.hp + 5 * dt / 60);
        for (const o of towers) {
          if (o === t) continue;
          if (Math.hypot(o.x - t.x, o.y - t.y) <= t.range) {
            o.hp = Math.min(o.maxHp, o.hp + 1 * dt / 60);
          }
        }
      }
      continue;
    }

    if (t.isParadox) {
      if (t.cooldown <= 0) {
        paradoxZones.push({ x: t.x, y: t.y, radius: t.range, life: t.duration, maxLife: t.duration, pulse: 0 });
        addShockwave(t.x, t.y, PURPLE, t.range, 30);
        addShockwave(t.x, t.y, WHITE, t.range * 0.7, 20);
        burst(t.x, t.y, 30, { speed: 4, life: 30, size: 3, color: PURPLE });
        addFlash(0.35, '170,102,255');
        addShake(4);
        Sound.shootGlacial();
        t.cooldown = t.fireRate;
      }
      continue;
    }

    let target = null, bestDist = Infinity;

    if (t.isDrone) {
      for (const e of enemies) {
        if (!e.isAir) continue;
        const d = Math.hypot(e.x - t.x, (e.y - (e.airHeight || 0)) - t.y);
        if (d < t.range && d < bestDist) { bestDist = d; target = e; }
      }
    }

    if (!target) {
      for (const e of enemies) {
        const d = Math.hypot(e.x - t.x, (e.y - (e.airHeight || 0)) - t.y);
        if (d < t.range && d < bestDist) {
          if (e.isAir && !t.hitsAir) continue;
          bestDist = d; target = e;
        }
      }
    }

    if (target) {
      const targetY = target.y - (target.airHeight || 0);
      t.angle = Math.atan2(targetY - t.y, target.x - t.x);
      if (t.cooldown <= 0) {
        const mx = t.x + Math.cos(t.angle) * 14;
        const my = t.y + Math.sin(t.angle) * 14;
        let actualDamage = t.damage;
        if (t.isDrone && target.isAir) actualDamage = t.damage * 3;

        if (t.isFlamethrower) {
          addFlameCone(t.x, t.y, t.angle, t.range);
          damageEnemy(target, actualDamage, t.x, t.y);
          applyFire(target, t.fireDmg, t.fireDur);
          if (t.starLevel >= 3) target.fireIgnoresArmor = true;
          burst(mx, my, 6, { speed: 2.5, life: 15, size: 2, color: FIRE });
          t.recoil = 2;
          Sound.shootLanca();
        } else if (t.isBoxer) {
          t.punchAnim = 1;
          damageEnemy(target, actualDamage, t.x, t.y);
          burst(target.x, targetY, 8, { speed: 3, life: 15, size: 2, color: BOXER });
          addShockwave(target.x, targetY, BOXER, 18, 12);
          if (t.starLevel >= 3) target.iceFrozen = 18; // atordoa 0.3s
          t.recoil = 4;
          Sound.shootBoxer();
        } else if (t.isGlacial) {
          burst(mx, my, 5, { speed: 2, life: 12, size: 2, color: ICE });
          addShockwave(mx, my, ICE, 10, 10);
          bullets.push({ x: t.x, y: t.y, target, damage: actualDamage, speed: 8, type: 'glacial', angle: t.angle, iceDur: t.iceDur, splashIce: t.starLevel >= 3 });
          t.recoil = 3;
          Sound.shootGlacial();
        } else if (t.isTesla) {
          const chainPoints = [{ x: t.x, y: t.y }, { x: target.x, y: targetY }];
          const hitEnemies = [target];
          let current = target; let currentY = targetY;
          let currentDmg = actualDamage;
          damageEnemy(current, currentDmg);
          if (t.starLevel >= 3) current.iceFrozen = 12;
          currentDmg -= 5;
          let chainsLeft = t.maxChains;
          while (chainsLeft > 0) {
            let next = null, nextDist = Infinity, nextY = 0;
            for (const e of enemies) {
              if (hitEnemies.indexOf(e) !== -1) continue;
              if (e.hp <= 0) continue;
              if (e.isAir && !t.hitsAir) continue;
              const ey = e.y - (e.airHeight || 0);
              const d = Math.hypot(e.x - current.x, ey - currentY);
              if (d <= t.chainRange && d < nextDist) { nextDist = d; next = e; nextY = ey; }
            }
            if (!next) break;
            chainPoints.push({ x: next.x, y: nextY });
            damageEnemy(next, Math.max(15, currentDmg));
            if (t.starLevel >= 3) next.iceFrozen = 12;
            hitEnemies.push(next);
            current = next; currentY = nextY;
            currentDmg -= 5; chainsLeft--;
          }
          addTeslaBolt(chainPoints);
          addShockwave(target.x, targetY, TESLA, 15, 12);
          burst(target.x, targetY, 8, { speed: 3, life: 15, size: 2, color: TESLA });
          addFlash(0.08, '255,255,102');
          t.recoil = 3;
          Sound.shootTesla();
        } else if (t.type === 'bazuca') {
          burst(mx, my, 8, { speed: 3, life: 14, size: 2, color: ORANGE });
          addShockwave(mx, my, ORANGE, 12, 12);
          missiles.push({ x: t.x, y: t.y, target, damage: actualDamage, splash: t.splash, speed: 6, angle: t.angle, life: 300, splitOnExplode: t.starLevel >= 3 });
          t.recoil = 6;
          Sound.fireBazuca();
        } else if (t.type === 'sniper') {
          // Sniper hitscan
          damageEnemy(target, actualDamage, t.x, t.y);
          addShockwave(target.x, targetY, CYAN, 15, 10);
          burst(target.x, targetY, 8, { speed: 3, life: 15, size: 2, color: CYAN });
          addFlash(0.08);
          Sound.shootSniper();
          // ⭐3: perfura — atinge próximo na linha
          if (t.starLevel >= 3) {
            const dirX = Math.cos(t.angle), dirY = Math.sin(t.angle);
            let pierced = null, bestP = Infinity;
            for (const e of enemies) {
              if (e === target || e.hp <= 0) continue;
              const ex = e.x, ey = e.y - (e.airHeight || 0);
              const dx = ex - target.x, dy = ey - targetY;
              const dist = Math.hypot(dx, dy);
              if (dist > 12 * PPM) continue;
              const dot = (dx * dirX + dy * dirY) / dist;
              if (dot > 0.85 && dist < bestP) { bestP = dist; pierced = e; }
            }
            if (pierced) {
              damageEnemy(pierced, Math.floor(actualDamage * 0.7));
              addSpark(target.x, targetY, pierced.x, pierced.y - (pierced.airHeight || 0), CYAN);
            }
          }
          t.recoil = 4;
        } else {
          burst(mx, my, 5, { speed: 2, life: 10, size: 1.5, color: t.isDrone ? DRONE : GREEN_BRIGHT });
          addShockwave(mx, my, t.isDrone ? DRONE : GREEN, 8, 8);
          t.recoil = 4;
          bullets.push({ x: t.x, y: t.y, target, damage: actualDamage, speed: 8, type: t.isDrone ? 'drone' : t.type, angle: t.angle });
          if (t.isDrone) Sound.shootDrone();
          else if (t.type === 'metralhadora') Sound.shootMetralhadora();
          else if (t.type === 'faca') Sound.shootFaca();
          else Sound.shootRecruta();
        }
        t.cooldown = t.fireRate;
      }
    }
  }

  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    m.life -= dt;
    addTrail(m.x, m.y, ORANGE, 4, 14);
    if (Math.random() < 0.5) {
      addParticle(m.x, m.y, { vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
        life: 20, size: 2, color: ORANGE, friction: 0.95 });
    }
    if (!m.target || m.target.hp <= 0 || enemies.indexOf(m.target) === -1) {
      bazookaExplosion(m.x, m.y, m.damage, m.splash, m.splitOnExplode); missiles.splice(i, 1); continue;
    }
    const targetY = m.target.y - (m.target.airHeight || 0);
    const desiredAngle = Math.atan2(targetY - m.y, m.target.x - m.x);
    let diff = desiredAngle - m.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    m.angle += Math.max(-0.12, Math.min(0.12, diff)) * dt;
    const dx = m.target.x - m.x, dy = targetY - m.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 12 || m.life <= 0) { bazookaExplosion(m.x, m.y, m.damage, m.splash, m.splitOnExplode); missiles.splice(i, 1); continue; }
    m.x += Math.cos(m.angle) * m.speed * dt;
    m.y += Math.sin(m.angle) * m.speed * dt;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const trailCol = b.type === 'sniper' ? CYAN : b.type === 'glacial' ? ICE : (b.type === 'drone' ? DRONE : GREEN);
    addTrail(b.x, b.y, trailCol, b.type === 'faca' ? 3 : 2, 10);
    if (!b.target || b.target.hp <= 0 || enemies.indexOf(b.target) === -1) {
      burst(b.x, b.y, 4, { speed: 1.5, life: 10, size: 1.5 }); bullets.splice(i, 1); continue;
    }
    const targetY = b.target.y - (b.target.airHeight || 0);
    const dx = b.target.x - b.x, dy = targetY - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist < b.speed * dt) {
      damageEnemy(b.target, b.damage, b.x, b.y);
      Sound.enemyHit();
      if (b.type === 'faca') {
        burst(b.target.x, targetY, 12, { speed: 4, life: 18, size: 2.5 });
        addShockwave(b.target.x, targetY, GREEN, 18, 12); addShake(1.5);
      } else if (b.type === 'glacial') {
        applyIce(b.target, b.iceDur);
        burst(b.target.x, targetY, 10, { speed: 3, life: 18, size: 2, color: ICE });
        addShockwave(b.target.x, targetY, ICE, 18, 14);
        // ⭐3: splash gelo
        if (b.splashIce) {
          const inRange = enemies.filter(e => e !== b.target && Math.hypot(e.x - b.target.x, (e.y - (e.airHeight || 0)) - targetY) <= 1.5 * PPM);
          for (const e of inRange) {
            applyIce(e, Math.floor(b.iceDur * 0.7));
            damageEnemy(e, Math.floor(b.damage * 0.5));
          }
        }
      } else if (b.type === 'metralhadora') {
        burst(b.target.x, targetY, 4, { speed: 2.5, life: 10, size: 1.5 });
      } else if (b.type === 'drone') {
        burst(b.target.x, targetY, 6, { speed: 3, life: 15, size: 2, color: DRONE });
        addShockwave(b.target.x, targetY, DRONE, 14, 10);
      }
      bullets.splice(i, 1);
    } else { b.x += (dx/dist) * b.speed * dt; b.y += (dy/dist) * b.speed * dt; }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= p.friction; p.vy *= p.friction; p.vy += p.gravity * dt;
    p.life -= dt; if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = trails.length - 1; i >= 0; i--) { trails[i].life -= dt; if (trails[i].life <= 0) trails.splice(i, 1); }
  for (let i = airTrails.length - 1; i >= 0; i--) {
    const at = airTrails[i];
    at.x += at.vx * dt; at.y += at.vy * dt;
    at.life -= dt; if (at.life <= 0) airTrails.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i]; s.life -= dt;
    const p = 1 - (s.life / s.maxLife); s.radius = s.maxRadius * p;
    if (s.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) { sparks[i].life -= dt; if (sparks[i].life <= 0) sparks.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) {
    const tx = texts[i]; tx.y += tx.vy * dt; tx.vy *= 0.97; tx.life -= dt;
    if (tx.life <= 0) texts.splice(i, 1);
  }
  for (let i = heals.length - 1; i >= 0; i--) { heals[i].life -= dt; if (heals[i].life <= 0) heals.splice(i, 1); }
  for (let i = moneyPops.length - 1; i >= 0; i--) {
    const mp = moneyPops[i]; mp.y += mp.vy * dt; mp.vy *= 0.97; mp.life -= dt;
    if (mp.life <= 0) moneyPops.splice(i, 1);
  }
  for (let i = crystalPops.length - 1; i >= 0; i--) {
    const cp = crystalPops[i]; cp.y += cp.vy * dt; cp.vy *= 0.97; cp.life -= dt;
    if (cp.life <= 0) crystalPops.splice(i, 1);
  }
  for (let i = flames.length - 1; i >= 0; i--) { flames[i].life -= dt; if (flames[i].life <= 0) flames.splice(i, 1); }
  for (let i = teslaBolts.length - 1; i >= 0; i--) { teslaBolts[i].life -= dt; if (teslaBolts[i].life <= 0) teslaBolts.splice(i, 1); }
  for (let i = explosions.length - 1; i >= 0; i--) { explosions[i].life -= dt; if (explosions[i].life <= 0) explosions.splice(i, 1); }

  shakeAmount *= shakeDecay; if (shakeAmount < 0.1) shakeAmount = 0;
  screenFlash *= 0.88; if (screenFlash < 0.01) screenFlash = 0;

  draw();
  if (bossActive) updateUI();
}

// ===== DRAW (mesma lógica v17 + estrelas visuais) =====
function draw() {
  ctx.save();
  if (shakeAmount > 0.1) {
    const sx = (Math.random() - 0.5) * shakeAmount;
    const sy = (Math.random() - 0.5) * shakeAmount;
    ctx.translate(sx, sy);
  }
  ctx.fillStyle = BLACK;
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

  ctx.strokeStyle = 'rgba(51,255,51,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += PPM) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y <= canvas.height; y += PPM) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(51,255,51,0.15)';
  for (let x = 0; x <= canvas.width; x += PPM * 5) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y <= canvas.height; y += PPM * 5) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

  for (const z of healZones) {
    const p = z.life / z.maxLife;
    ctx.globalAlpha = 0.15 * p + Math.sin(z.pulse) * 0.05;
    ctx.fillStyle = TOXIC;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.6 * p; ctx.strokeStyle = TOXIC; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;

  for (const e of enemies) {
    if (e.aura > 0) {
      const pulse = 0.6 + Math.sin(Date.now() / 300) * 0.2;
      ctx.globalAlpha = 0.12 * pulse;
      ctx.fillStyle = ICE;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.aura, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.5 * pulse;
      ctx.strokeStyle = ICE; ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.aura, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  for (const z of paradoxZones) {
    const p = z.life / z.maxLife;
    ctx.globalAlpha = 0.25 * p + Math.sin(z.pulse) * 0.08;
    ctx.fillStyle = PURPLE;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.7 * p; ctx.strokeStyle = PURPLE; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.6 * p;
    ctx.strokeStyle = WHITE; ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius * 0.7, Date.now()/500, Date.now()/500 + Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;

  const pathPulse = 0.15 + Math.sin(Date.now() / 400) * 0.03;
  ctx.strokeStyle = bossActive ? OGRE : GREEN;
  ctx.lineWidth = pathWidth; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
  ctx.globalAlpha = bossActive ? 0.4 : pathPulse;
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);

  for (const e of enemies) {
    if (e.isAir) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(e.x, e.y, e.size * 0.8, e.size * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const at of airTrails) {
    const p = at.life / at.maxLife;
    ctx.globalAlpha = p * 0.7;
    ctx.fillStyle = AIR;
    ctx.fillRect(at.x - 1.5, at.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  for (const tr of trails) {
    const p = tr.life / tr.maxLife;
    ctx.globalAlpha = p * 0.7; ctx.fillStyle = tr.color;
    ctx.fillRect(tr.x - tr.size/2, tr.y - tr.size/2, tr.size, tr.size);
  }
  ctx.globalAlpha = 1;

  for (const f of flames) {
    const p = f.life / f.maxLife;
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.angle);
    ctx.globalAlpha = p * 0.75;
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, f.range);
    grad.addColorStop(0, 'rgba(255,255,150,1)');
    grad.addColorStop(0.3, 'rgba(255,170,50,0.9)');
    grad.addColorStop(0.7, 'rgba(255,100,0,0.6)');
    grad.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = grad;
    const spread = Math.PI / 6;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, f.range, -spread, spread);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  for (const t of towers) {
    const isFrozenByYeti = t.frozenByYeti;

    if (t.isDefensor) {
      const pulse = 0.3 + Math.sin(t.defensorPulse) * 0.15;
      ctx.strokeStyle = SHIELD; ctx.globalAlpha = pulse; ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.08; ctx.fillStyle = SHIELD;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (t.isHealer) {
      const healAlpha = t.healPulse > 0 ? 0.4 : 0.15;
      const pulseSize = t.healPulse > 0 ? 1 + t.healPulse * 0.3 : 1;
      ctx.strokeStyle = isFrozenByYeti ? ICE : GREEN_BRIGHT;
      ctx.globalAlpha = healAlpha; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range * pulseSize, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.05 * pulseSize;
      ctx.fillStyle = isFrozenByYeti ? ICE : GREEN_BRIGHT;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (t.isMerchant) {
      const merchantAlpha = t.incomePulse > 0 ? 0.5 : 0.2;
      const pulseSize = t.incomePulse > 0 ? 1 + t.incomePulse * 0.4 : 1;
      ctx.strokeStyle = isFrozenByYeti ? ICE : GOLD;
      ctx.globalAlpha = merchantAlpha; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.x, t.y, 25 * pulseSize, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.08; ctx.fillStyle = isFrozenByYeti ? ICE : GOLD;
      ctx.beginPath(); ctx.arc(t.x, t.y, 30, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      let rangeCol = 'rgba(51,255,51,0.25)';
      if (isFrozenByYeti) rangeCol = 'rgba(136,221,255,0.4)';
      else if (t.isFlamethrower) rangeCol = 'rgba(255,100,0,0.3)';
      else if (t.isGlacial) rangeCol = 'rgba(136,221,255,0.3)';
      else if (t.isTesla) rangeCol = 'rgba(255,255,102,0.3)';
      else if (t.isParadox) rangeCol = 'rgba(170,102,255,0.3)';
      else if (t.isBoxer) rangeCol = 'rgba(255,102,68,0.3)';
      else if (t.isDrone) rangeCol = 'rgba(102,238,255,0.35)';
      ctx.strokeStyle = rangeCol; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    const hpPct = t.hp / t.maxHp;
    let col;
    if (isFrozenByYeti) col = ICE;
    else if (t.isHealer) col = hpPct > 0.5 ? GREEN_BRIGHT : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isMerchant) col = hpPct > 0.5 ? GOLD : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isFlamethrower) col = hpPct > 0.5 ? FIRE : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isGlacial) col = hpPct > 0.5 ? ICE : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isTesla) col = hpPct > 0.5 ? TESLA : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isDefensor) col = hpPct > 0.5 ? SHIELD : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isParadox) col = hpPct > 0.5 ? PURPLE : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isBoxer) col = hpPct > 0.5 ? BOXER : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isDrone) col = hpPct > 0.5 ? DRONE : hpPct > 0.25 ? YELLOW : ORANGE;
    else col = hpPct > 0.5 ? GREEN : hpPct > 0.25 ? YELLOW : ORANGE;

    let scale = 1;
    if (t.spawnAnim > 0) scale = 0.5 + (1 - t.spawnAnim / 20) * 0.5;

    if (t.isProtected && !t.isDefensor) {
      ctx.strokeStyle = SHIELD; ctx.globalAlpha = 0.4; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(t.x, t.y, 17, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // ⭐ Borda dourada por estrela
    if (t.starLevel > 0) {
      ctx.strokeStyle = GOLD;
      ctx.globalAlpha = 0.5 + t.starLevel * 0.15;
      ctx.lineWidth = t.starLevel * 0.8;
      ctx.strokeRect(t.x - 13, t.y - 13, 26, 26);
      ctx.globalAlpha = 1;
    }

    let punchOffset = 0;
    if (t.isBoxer && t.punchAnim > 0) {
      const punchPct = 1 - t.punchAnim;
      punchOffset = Math.sin(punchPct * Math.PI) * 6;
    }

    ctx.save();
    ctx.translate(t.x + Math.cos(t.angle) * punchOffset, t.y + Math.sin(t.angle) * punchOffset);
    ctx.scale(scale, scale);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.strokeRect(-11, -11, 22, 22);
    ctx.beginPath();
    ctx.moveTo(-11, -11); ctx.lineTo(-6, -11);
    ctx.moveTo(-11, -11); ctx.lineTo(-11, -6);
    ctx.moveTo(11, -11); ctx.lineTo(6, -11);
    ctx.moveTo(11, -11); ctx.lineTo(11, -6);
    ctx.moveTo(-11, 11); ctx.lineTo(-6, 11);
    ctx.moveTo(-11, 11); ctx.lineTo(-11, 6);
    ctx.moveTo(11, 11); ctx.lineTo(6, 11);
    ctx.moveTo(11, 11); ctx.lineTo(11, 6);
    ctx.stroke();

    if (!t.isHealer && !t.isMerchant && !t.isDefensor && !t.isParadox && !t.isBoxer) {
      const recoilOffset = t.recoil > 0 ? -t.recoil : 0;
      ctx.rotate(t.angle); ctx.fillStyle = col;
      if (t.type === 'bazuca') {
        ctx.fillRect(11 + recoilOffset, -3, 14, 6);
        ctx.fillRect(22 + recoilOffset, -4, 4, 8);
      } else if (t.type === 'metralhadora') {
        ctx.fillRect(11 + recoilOffset, -2, 14, 2);
        ctx.fillRect(11 + recoilOffset, 0, 14, 2);
      } else if (t.isFlamethrower) {
        ctx.fillRect(11 + recoilOffset, -3, 14, 6);
        ctx.fillRect(23 + recoilOffset, -5, 4, 10);
      } else {
        ctx.fillRect(11 + recoilOffset, -2, 12, 4);
      }
    }
    ctx.restore();

    ctx.fillStyle = col;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    if (t.isHealer) {
      ctx.shadowColor = isFrozenByYeti ? ICE : GREEN_BRIGHT;
      ctx.shadowBlur = t.healPulse > 0 ? 15 : 6;
      ctx.fillRect(t.x - 2, t.y - 8, 4, 16);
      ctx.fillRect(t.x - 8, t.y - 2, 16, 4);
      ctx.shadowBlur = 0;
    } else if (t.isMerchant) {
      ctx.font = 'bold 16px VT323, monospace';
      ctx.shadowColor = isFrozenByYeti ? ICE : GOLD;
      ctx.shadowBlur = t.incomePulse > 0 ? 15 : 6;
      ctx.fillText('$', t.x, t.y + 1); ctx.shadowBlur = 0;
    } else if (t.isBoxer) {
      ctx.shadowColor = BOXER; ctx.shadowBlur = t.punchAnim > 0 ? 12 : 6;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(t.x + 2, t.y - 2, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(t.x - 6, t.y - 2, 6, 6);
      ctx.shadowBlur = 0;
    } else if (t.isFlamethrower) {
      ctx.shadowColor = FIRE; ctx.shadowBlur = 10;
      ctx.fillStyle = FIRE_BRIGHT;
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - 7); ctx.lineTo(t.x - 5, t.y + 3);
      ctx.lineTo(t.x - 2, t.y + 3); ctx.lineTo(t.x - 2, t.y + 7);
      ctx.lineTo(t.x + 2, t.y + 7); ctx.lineTo(t.x + 2, t.y + 3);
      ctx.lineTo(t.x + 5, t.y + 3); ctx.closePath();
      ctx.fill(); ctx.shadowBlur = 0;
    } else if (t.isGlacial) {
      ctx.shadowColor = ICE; ctx.shadowBlur = 8;
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = (Math.PI / 3) * i;
        ctx.beginPath();
        ctx.moveTo(t.x - Math.cos(a) * 8, t.y - Math.sin(a) * 8);
        ctx.lineTo(t.x + Math.cos(a) * 8, t.y + Math.sin(a) * 8);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    } else if (t.isTesla) {
      ctx.shadowColor = TESLA; ctx.shadowBlur = 10;
      ctx.fillStyle = TESLA;
      ctx.beginPath();
      ctx.moveTo(t.x - 4, t.y - 8); ctx.lineTo(t.x + 1, t.y - 2);
      ctx.lineTo(t.x - 3, t.y - 1); ctx.lineTo(t.x + 3, t.y + 8);
      ctx.lineTo(t.x - 1, t.y + 2); ctx.lineTo(t.x + 3, t.y + 1);
      ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    } else if (t.isDefensor) {
      ctx.shadowColor = SHIELD; ctx.shadowBlur = 10;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - 9); ctx.lineTo(t.x + 8, t.y - 6);
      ctx.lineTo(t.x + 8, t.y + 2); ctx.lineTo(t.x, t.y + 9);
      ctx.lineTo(t.x - 8, t.y + 2); ctx.lineTo(t.x - 8, t.y - 6);
      ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    } else if (t.isParadox) {
      ctx.shadowColor = PURPLE; ctx.shadowBlur = 10;
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      const s = 7;
      ctx.beginPath();
      ctx.moveTo(t.x - s, t.y - s); ctx.lineTo(t.x + s, t.y - s);
      ctx.lineTo(t.x, t.y); ctx.lineTo(t.x + s, t.y + s);
      ctx.lineTo(t.x - s, t.y + s); ctx.lineTo(t.x, t.y);
      ctx.lineTo(t.x - s, t.y - s);
      ctx.stroke(); ctx.shadowBlur = 0;
    } else if (t.isDrone) {
      ctx.shadowColor = DRONE; ctx.shadowBlur = 10;
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      const rotAngle = t.droneRotorAngle;
      for (let i = 0; i < 2; i++) {
        const baseAngle = rotAngle + i * Math.PI;
        ctx.beginPath();
        ctx.moveTo(t.x + Math.cos(baseAngle) * 8, t.y - 6 + Math.sin(baseAngle) * 3);
        ctx.lineTo(t.x - Math.cos(baseAngle) * 8, t.y - 6 - Math.sin(baseAngle) * 3);
        ctx.stroke();
      }
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - 4); ctx.lineTo(t.x, t.y - 10);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      ctx.font = 'bold 13px VT323, monospace';
      const sym = t.type === 'recruta' ? 'R' : t.type === 'sniper' ? 'S' : t.type === 'faca' ? 'F' : t.type === 'metralhadora' ? 'M' : 'B';
      ctx.fillText(sym, t.x, t.y + 1);
    }

    // ⭐ Estrelinhas abaixo do quadrado
    if (t.starLevel > 0) {
      ctx.font = 'bold 10px VT323, monospace';
      ctx.fillStyle = GOLD;
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 5;
      const starsText = '⭐'.repeat(t.starLevel);
      ctx.fillText(starsText, t.x, t.y - 18);
      ctx.shadowBlur = 0;
    }

    if (isFrozenByYeti) {
      ctx.strokeStyle = ICE;
      ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 200) * 0.3;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(t.x, t.y, 17, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      for (let k = 0; k < 4; k++) {
        const ang = (Math.PI / 2) * k + Date.now() / 800;
        const px = t.x + Math.cos(ang) * 15;
        const py = t.y + Math.sin(ang) * 15;
        ctx.fillStyle = ICE;
        ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
      }
    }

    const bw = 26, bh = 3, bx = t.x - bw/2, by = t.y + 15;
    ctx.fillStyle = GREEN_DARK; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = col; ctx.fillRect(bx, by, bw * hpPct, bh);

    if (hpPct < 0.3 && Math.floor(Date.now() / 200) % 2 === 0) {
      ctx.strokeStyle = YELLOW; ctx.lineWidth = 1;
      ctx.strokeRect(t.x - 13, t.y - 13, 26, 26);
    }
  }

  for (const sp of sparks) {
    const p = sp.life / sp.maxLife;
    ctx.strokeStyle = sp.color; ctx.globalAlpha = p; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sp.x1, sp.y1); ctx.lineTo(sp.x2, sp.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const s of shockwaves) {
    const p = s.life / s.maxLife;
    ctx.strokeStyle = s.color; ctx.globalAlpha = p * 0.8;
    ctx.lineWidth = 2 + (1 - p) * 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const b of bullets) {
    if (b.type === 'sniper') {
      // já foi desenhado dentro do sniper via spark
    } else if (b.type === 'metralhadora') {
      ctx.fillStyle = YELLOW; ctx.shadowColor = YELLOW; ctx.shadowBlur = 6;
      ctx.fillRect(b.x - 2, b.y - 2, 4, 4); ctx.shadowBlur = 0;
    } else if (b.type === 'glacial') {
      ctx.fillStyle = ICE; ctx.shadowColor = ICE; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    } else if (b.type === 'drone') {
      ctx.fillStyle = DRONE; ctx.shadowColor = DRONE; ctx.shadowBlur = 8;
      ctx.fillRect(b.x - 2, b.y - 2, 4, 4); ctx.shadowBlur = 0;
    } else {
      const p = 0.7 + Math.sin(Date.now() / 60) * 0.3;
      ctx.fillStyle = GREEN_BRIGHT; ctx.shadowColor = GREEN; ctx.shadowBlur = 8 * p;
      const s = b.type === 'faca' ? 5 : 3;
      ctx.fillRect(b.x - s/2, b.y - s/2, s, s); ctx.shadowBlur = 0;
    }
  }

  for (const m of missiles) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle);
    ctx.fillStyle = ORANGE; ctx.shadowColor = ORANGE; ctx.shadowBlur = 12;
    ctx.fillRect(-8, -3, 16, 6);
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(14, 0); ctx.lineTo(8, 3); ctx.closePath(); ctx.fill();
    const flameLen = 6 + Math.random() * 4;
    ctx.beginPath(); ctx.moveTo(-8, -3); ctx.lineTo(-8 - flameLen, 0); ctx.lineTo(-8, 3); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
  }

  for (const tb of teslaBolts) {
    const p = tb.life / tb.maxLife;
    ctx.strokeStyle = TESLA; ctx.shadowColor = TESLA; ctx.shadowBlur = 15;
    ctx.globalAlpha = p; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < tb.points.length; i++) {
      const pt = tb.points[i];
      const nx = pt.x + (i > 0 && i < tb.points.length - 1 ? (Math.random() - 0.5) * 6 : 0);
      const ny = pt.y + (i > 0 && i < tb.points.length - 1 ? (Math.random() - 0.5) * 6 : 0);
      if (i === 0) ctx.moveTo(nx, ny); else ctx.lineTo(nx, ny);
    }
    ctx.stroke();
    ctx.strokeStyle = WHITE; ctx.lineWidth = 1; ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  for (const h of heals) {
    const p = h.life / h.maxLife;
    const size = 6 + (1 - p) * 4;
    ctx.globalAlpha = p; ctx.fillStyle = GREEN_BRIGHT;
    ctx.shadowColor = GREEN_BRIGHT; ctx.shadowBlur = 10;
    ctx.fillRect(h.x - size/4, h.y - size, size/2, size * 2);
    ctx.fillRect(h.x - size, h.y - size/4, size * 2, size/2);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  for (const e of enemies) drawEnemy(e);

  for (const tx of texts) {
    const alpha = tx.life / tx.maxLife;
    ctx.globalAlpha = alpha; ctx.fillStyle = tx.color;
    ctx.font = `bold ${tx.size || 14}px VT323, monospace`;
    ctx.textAlign = 'center'; ctx.shadowColor = tx.color; ctx.shadowBlur = 6;
    ctx.fillText(tx.text, tx.x, tx.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  for (const mp of moneyPops) {
    const alpha = mp.life / mp.maxLife;
    ctx.globalAlpha = alpha; ctx.fillStyle = GOLD;
    ctx.font = 'bold 18px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = GOLD; ctx.shadowBlur = 10;
    ctx.fillText(mp.text, mp.x, mp.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  for (const cp of crystalPops) {
    const alpha = cp.life / cp.maxLife;
    ctx.globalAlpha = alpha; ctx.fillStyle = CRYSTAL;
    ctx.font = 'bold 22px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = CRYSTAL; ctx.shadowBlur = 15;
    ctx.fillText(cp.text, cp.x, cp.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  if (dragging && dragging.overCanvas) {
    const d = dragging;
    const col = d.valid ? WHITE : RED;
    ctx.strokeStyle = col; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    const dragRange = getTowerStats(d.type).range || 30;
    ctx.beginPath(); ctx.arc(d.x, d.y, dragRange, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.08; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(d.x, d.y, dragRange, 0, Math.PI * 2); ctx.fill();
    if (d.type === 'bazuca') {
      ctx.globalAlpha = 0.15; ctx.strokeStyle = ORANGE; ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.arc(d.x, d.y, getTowerStats('bazuca').splash, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 0.9; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.strokeRect(d.x - 11, d.y - 11, 22, 22);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  if (screenFlash > 0.01) {
    ctx.fillStyle = `rgba(${screenFlashColor},${screenFlash})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (bossActive) {
    const pulseAmount = 0.2 + Math.sin(Date.now() / 250) * 0.15;
    const grad = ctx.createRadialGradient(240, 240, 150, 240, 240, 340);
    grad.addColorStop(0, 'rgba(102,255,51,0)');
    grad.addColorStop(1, `rgba(102,255,51,${pulseAmount})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const vg = ctx.createRadialGradient(240, 240, 150, 240, 240, 340);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = GREEN; ctx.font = 'bold 48px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = GREEN; ctx.shadowBlur = 20;
    ctx.fillText('|| PAUSA ||', canvas.width/2, canvas.height/2);
    ctx.shadowBlur = 0;
  }
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = RED; ctx.font = 'bold 48px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = RED; ctx.shadowBlur = 25;
    ctx.fillText('VOCÊ CAIU', canvas.width/2, canvas.height/2 - 20);
    ctx.fillStyle = GREEN; ctx.font = '28px VT323, monospace';
    ctx.shadowColor = GREEN; ctx.shadowBlur = 15;
    ctx.fillText('ONDA ' + waveNum, canvas.width/2, canvas.height/2 + 30);
    ctx.shadowBlur = 0;
  }
}

function drawEnemy(e) {
  const s = e.size;
  const isHit = e.hitFlash > 0;
  const isYeti = e.type === 'yeti';
  const isBoss = e.isBoss;
  const isBurning = e.fireTimer > 0;
  const isIceFrozen = e.iceFrozen > 0;
  const isAir = e.isAir;

  let color;
  if (isHit) color = '#ffffff';
  else if (isIceFrozen) color = FROZEN;
  else if (isBurning) color = FIRE_BRIGHT;
  else if (isYeti) color = ICE;
  else if (isBoss) color = OGRE;
  else if (isAir) color = AIR;
  else if (e.type === 'fungo') color = TOXIC;
  else color = GREEN;

  const yOffset = isAir ? -e.airHeight - Math.sin(e.airBob) * 2 : 0;

  let scale = 1;
  if (e.spawnAnim > 0) {
    const pct = 1 - e.spawnAnim / (isBoss ? 40 : 15);
    scale = isBoss ? 0.2 + pct * 0.8 : 0.3 + pct * 0.7;
  }

  if (isBurning && !isHit) { ctx.shadowColor = FIRE; ctx.shadowBlur = 12; }
  if (isIceFrozen && !isHit) { ctx.shadowColor = FROZEN; ctx.shadowBlur = 12; }
  if (isBoss && !isHit) { ctx.shadowColor = OGRE; ctx.shadowBlur = 25; }
  if (isAir && !isHit) { ctx.shadowColor = AIR; ctx.shadowBlur = 12; }

  ctx.save();
  ctx.translate(e.x, e.y + yOffset); ctx.scale(scale, scale);
  ctx.strokeStyle = color;
  ctx.fillStyle = isHit ? color : BLACK;
  ctx.lineWidth = isBoss ? 4 : 2;

  switch (e.drawStyle) {
    case 'square':
      ctx.fillRect(-s/2, -s/2, s, s); ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.fillStyle = color;
      if (!isIceFrozen) { ctx.fillRect(-3, -3, 2, 2); ctx.fillRect(1, -3, 2, 2); }
      break;
    case 'tank':
      ctx.fillRect(-s/2, -s/2 + 2, s, s - 4); ctx.strokeRect(-s/2, -s/2 + 2, s, s - 4);
      ctx.strokeRect(-s/2 - 2, -s/2 + 4, s + 4, s - 8);
      ctx.fillStyle = color;
      ctx.fillRect(-s/2 + 2, -1, 2, 2); ctx.fillRect(s/2 - 4, -1, 2, 2);
      ctx.beginPath(); ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0); ctx.stroke();
      break;
    case 'triangle':
      ctx.beginPath(); ctx.moveTo(s/2, 0); ctx.lineTo(-s/2, -s/2); ctx.lineTo(-s/2, s/2);
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'arrow':
      ctx.beginPath(); ctx.moveTo(s/2, 0); ctx.lineTo(-s/2, -s/2);
      ctx.lineTo(-s/4, 0); ctx.lineTo(-s/2, s/2);
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'diamond':
      ctx.beginPath(); ctx.moveTo(0, -s/2); ctx.lineTo(s/2, 0);
      ctx.lineTo(0, s/2); ctx.lineTo(-s/2, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'dot':
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, s/2, 0, Math.PI * 2); ctx.fill(); break;
    case 'star':
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI / 4) * i - Math.PI / 2;
        const r = i % 2 === 0 ? s/2 : s/4;
        const px = Math.cos(angle) * r, py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'mushroom':
      ctx.fillStyle = isHit ? color : BLACK;
      ctx.fillRect(-3, -s/2 + 4, 6, s/2 + 2);
      ctx.strokeRect(-3, -s/2 + 4, 6, s/2 + 2);
      ctx.beginPath(); ctx.arc(0, -s/2 + 4, s/2, Math.PI, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(-4, -s/2 + 1, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, -s/2 - 1, 1.5, 0, Math.PI * 2); ctx.fill();
      break;
    case 'yeti':
      ctx.fillStyle = isHit ? color : BLACK;
      ctx.fillRect(-s/2, -s/2, s, s);
      ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.strokeRect(-s/4, -s/4, s/2, s/2);
      ctx.beginPath();
      ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0);
      ctx.moveTo(0, -s/2); ctx.lineTo(0, s/2);
      ctx.moveTo(-s/3, -s/3); ctx.lineTo(s/3, s/3);
      ctx.moveTo(-s/3, s/3); ctx.lineTo(s/3, -s/3);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.fillRect(-4, -4, 2, 2); ctx.fillRect(2, -4, 2, 2);
      break;
    case 'air':
      ctx.fillStyle = isHit ? color : '#0a2a2a';
      ctx.beginPath();
      ctx.ellipse(0, 0, s/2 + 4, s/4, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -3, s/3, Math.PI, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = color;
      const blink = Math.floor(Date.now() / 200) % 2 === 0;
      ctx.beginPath(); ctx.arc(-s/2 + 2, 2, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s/2 - 2, 2, 1.8, 0, Math.PI * 2); ctx.fill();
      if (blink) { ctx.beginPath(); ctx.arc(0, 2, 2.2, 0, Math.PI * 2); ctx.fill(); }
      break;
    case 'ogro':
      ctx.fillStyle = isHit ? color : '#1a3a0a';
      ctx.fillRect(-s/2, -s/2, s, s);
      ctx.strokeStyle = color; ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-15, -s/2); ctx.lineTo(-10, -s/2 - 12); ctx.lineTo(-5, -s/2);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(5, -s/2); ctx.lineTo(10, -s/2 - 12); ctx.lineTo(15, -s/2);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.arc(-s/2 - 4, 5, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.arc(s/2 + 4, 5, 7, 0, Math.PI * 2); ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffff33';
      ctx.shadowColor = '#ffff33'; ctx.shadowBlur = 15;
      const eyeBlink = Math.floor(Date.now() / 300) % 4 === 0;
      if (!eyeBlink) {
        ctx.fillRect(-11, -6, 6, 6);
        ctx.fillRect(5, -6, 6, 6);
      } else {
        ctx.fillRect(-11, -2, 6, 2);
        ctx.fillRect(5, -2, 6, 2);
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000000';
      ctx.fillRect(-10, 6, 20, 8);
      ctx.fillStyle = color;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-10 + i * 5, 6);
        ctx.lineTo(-8 + i * 5, 12);
        ctx.lineTo(-6 + i * 5, 6);
        ctx.closePath(); ctx.fill();
      }
      break;
  }
  ctx.shadowBlur = 0;
  ctx.restore();

  const barY = e.y + yOffset - s/2 - (isBoss ? 15 : 7);
  const w = isBoss ? 50 : 20, h = isBoss ? 6 : 3;
  const bx = e.x - w/2, by = barY;
  ctx.fillStyle = GREEN_DARK; ctx.fillRect(bx, by, w, h);
  const segs = isBoss ? 10 : 5;
  const filled = Math.max(0, Math.ceil((e.hp / e.maxHp) * segs));
  let barCol;
  if (isBoss) barCol = OGRE;
  else if (isYeti) barCol = ICE;
  else if (isAir) barCol = AIR;
  else if (isIceFrozen) barCol = FROZEN;
  else if (isBurning) barCol = FIRE;
  else if (e.type === 'fungo') barCol = TOXIC;
  else barCol = GREEN;
  ctx.fillStyle = barCol;
  for (let i = 0; i < filled; i++) {
    const sw = (w / segs) - 1;
    ctx.fillRect(bx + i * (w/segs), by, sw, h);
  }
}

// ============ UI: MENU CRISTAIS ============
function updateMenuCrystals() {
  document.getElementById('menuCrystals').textContent = crystals;
  const upgC = document.getElementById('upgradeCrystals');
  if (upgC) upgC.textContent = crystals;
}

// ============ UI: UPGRADE SCREEN ============
function buildUpgradeGrid() {
  const grid = document.getElementById('upgradeGrid');
  grid.innerHTML = '';
  for (const type of TOWER_ORDER) {
    const def = TOWER_TYPES[type];
    const lvl = stars[type] || 0;
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    const cur = STAR_PROGRESSION[type][lvl];
    const next = lvl < 3 ? STAR_PROGRESSION[type][lvl + 1] : null;
    const starsText = '⭐'.repeat(lvl) + '☆'.repeat(3 - lvl);
    let costTxt, btnTxt, btnDisabled;
    if (lvl === 0) { costTxt = '20 💎'; btnTxt = '1 ESTRELA — 20💎'; btnDisabled = crystals < 20; }
    else if (lvl === 1) { costTxt = '50 💎'; btnTxt = '2 ESTRELAS — 50💎'; btnDisabled = crystals < 50; }
    else if (lvl === 2) { costTxt = '100 💎'; btnTxt = '3 ESTRELAS — 100💎'; btnDisabled = crystals < 100; }
    else { costTxt = 'MAX'; btnTxt = '⭐ MAX ⭐'; btnDisabled = true; }

    let statsHtml = `<div>HP: ${cur.hp}`;
    if (next) statsHtml += ` <span class="next">→ ${next.hp}</span>`;
    statsHtml += `</div>`;

    if (def.isHealer) {
      statsHtml += `<div>CURA: ${cur.heal}`;
      if (next) statsHtml += ` <span class="next">→ ${next.heal}</span>`;
      statsHtml += `</div>`;
    } else if (def.isMerchant) {
      statsHtml += `<div>OURO: +${cur.income}`;
      if (next) statsHtml += ` <span class="next">→ +${next.income}</span>`;
      statsHtml += `</div>`;
    } else if (def.isDefensor) {
      statsHtml += `<div>REDUÇÃO: ${Math.round(cur.reduction * 100)}%`;
      if (next) statsHtml += ` <span class="next">→ ${Math.round(next.reduction * 100)}%</span>`;
      statsHtml += `</div>`;
    } else if (def.isParadox) {
      statsHtml += `<div>DURAÇÃO: ${(cur.duration / 60).toFixed(1)}s`;
      if (next) statsHtml += ` <span class="next">→ ${(next.duration / 60).toFixed(1)}s</span>`;
      statsHtml += `</div>`;
    } else if (cur.damage !== undefined) {
      statsHtml += `<div>DANO: ${cur.damage}`;
      if (next) statsHtml += ` <span class="next">→ ${next.damage}</span>`;
      statsHtml += `</div>`;
    }
    statsHtml += `<div>ALC: ${(cur.range / 16).toFixed(1)}m`;
    if (next) statsHtml += ` <span class="next">→ ${(next.range / 16).toFixed(1)}m</span>`;
    statsHtml += `</div>`;

    card.innerHTML = `
      <div class="u-name">
        <span>${def.name}</span>
        <span class="u-stars">${starsText}</span>
      </div>
      <div class="u-stats">${statsHtml}</div>
      <button class="u-btn${lvl === 3 ? ' max' : ''}" ${btnDisabled ? 'disabled' : ''}>${btnTxt}</button>
    `;
    if (lvl < 3) {
      const btn = card.querySelector('.u-btn');
      btn.addEventListener('click', () => {
        const cost = lvl === 0 ? 20 : lvl === 1 ? 50 : 100;
        if (crystals < cost) { Sound.error(); return; }
        crystals -= cost;
        stars[type] = lvl + 1;
        saveCrystals(crystals);
        saveStars(stars);
        Sound.upgrade();
        updateMenuCrystals();
        buildUpgradeGrid();
      });
    }
    grid.appendChild(card);
  }
}

function showUpgradeScreen() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('upgradeScreen').style.display = 'flex';
  updateMenuCrystals();
  buildUpgradeGrid();
  Sound.select();
}
function hideUpgradeScreen() {
  document.getElementById('upgradeScreen').style.display = 'none';
}

// ============ DECK ============
function buildDeckGrid() {
  const grid = document.getElementById('deckGrid');
  grid.innerHTML = '';
  for (const type of TOWER_ORDER) {
    const def = TOWER_TYPES[type];
    const lvl = stars[type] || 0;
    const card = document.createElement('button');
    card.className = 'deck-card';
    card.dataset.type = type;
    card.innerHTML = `
      <div class="card-name">${'⭐'.repeat(lvl)} ${def.name}</div>
      <div class="card-cost">💰 ${def.cost === 400 && type === 'comerciante' ? '400+' : def.cost}</div>
      <div class="card-stat">${def.desc}</div>
    `;
    card.addEventListener('click', () => toggleDeckCard(type, card));
    if (selectedDeck.includes(type)) card.classList.add('selected');
    grid.appendChild(card);
  }
}
function toggleDeckCard(type, card) {
  const idx = selectedDeck.indexOf(type);
  if (idx >= 0) {
    selectedDeck.splice(idx, 1); card.classList.remove('selected');
  } else {
    if (selectedDeck.length >= DECK_SIZE) { showMsg('> DECK CHEIO (8/8)'); Sound.error(); return; }
    selectedDeck.push(type); card.classList.add('selected');
  }
  Sound.select();
  updateDeckUI(); saveDeck();
}
function updateDeckUI() {
  document.getElementById('deckCount').textContent = selectedDeck.length;
  const info = document.getElementById('deckInfo');
  if (selectedDeck.length === DECK_SIZE) info.classList.add('full');
  else info.classList.remove('full');
  document.getElementById('btnDeckStart').disabled = selectedDeck.length !== DECK_SIZE;
}
function saveDeck() {
  try { localStorage.setItem('td_deck', JSON.stringify(selectedDeck)); } catch(e) {}
}
function loadDeck() {
  try {
    const saved = localStorage.getItem('td_deck');
    if (saved) selectedDeck = JSON.parse(saved) || [];
  } catch(e) { selectedDeck = []; }
  selectedDeck = selectedDeck.filter(t => TOWER_ORDER.includes(t));
  if (selectedDeck.length > DECK_SIZE) selectedDeck = selectedDeck.slice(0, DECK_SIZE);
}

function buildTroopsShop() {
  const grid = document.getElementById('troopsGrid');
  grid.innerHTML = '';
  for (const type of selectedDeck) {
    const def = TOWER_TYPES[type];
    const lvl = stars[type] || 0;
    const btn = document.createElement('button');
    btn.className = 'tower-btn';
    btn.dataset.type = type;
    btn.innerHTML = `
      <span class="star-badge">${lvl > 0 ? '⭐'.repeat(lvl) : ''}</span>
      ${def.name} · <span class="cost-line" data-cost="${type}">${def.cost}</span>
      <div class="stat-line">${def.desc}</div>
    `;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      const cost = getCostForType(type);
      if (gold < cost) { showMsg('> CRÉDITOS INSUFICIENTES'); addShake(2); Sound.error(); return; }
      pointerDownInfo = { x: e.clientX, y: e.clientY, type, source: 'button' };
    });
    grid.appendChild(btn);
  }
}

function showDeckScreen() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('deckScreen').style.display = 'flex';
  loadDeck(); buildDeckGrid(); updateDeckUI();
  Sound.select();
}
function hideDeckScreen() { document.getElementById('deckScreen').style.display = 'none'; }

function startGame(mode) {
  gameMode = mode;
  chosenMap = MAPS[0];
  path = chosenMap.path;
  document.getElementById('mapName').textContent = chosenMap.name;

  hideDeckScreen();
  document.getElementById('menu').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('titleBar').style.display = 'block';
  document.getElementById('mapInfoBar').style.display = 'block';
  document.getElementById('soundBtn').style.display = 'block';

  document.body.classList.remove('mode-pc', 'mode-mobile');
  document.body.classList.add('mode-' + mode);

  gold = 100; waveNum = 0; paused = false; gameOver = false;
  playerHp = PLAYER_MAX_HP;
  runCrystalsEarned = 0;
  towers.length = 0; enemies.length = 0; bullets.length = 0;
  missiles.length = 0; explosions.length = 0; particles.length = 0;
  trails.length = 0; texts.length = 0; shockwaves.length = 0;
  sparks.length = 0; heals.length = 0; moneyPops.length = 0;
  crystalPops.length = 0;
  healZones.length = 0; flames.length = 0; teslaBolts.length = 0;
  paradoxZones.length = 0; airTrails.length = 0;
  waveQueue = []; waveActive = false; waveDelay = 0;
  bossActive = false; bossRef = null;
  dragging = null; selectedTowerType = null; pointerDownInfo = null;

  Sound.resume();
  buildTroopsShop();
  updateUI();
  startWave();
}

// ============ EVENTOS ============
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  Sound.init();
  const muted = Sound.toggle();
  soundBtn.textContent = muted ? '🔇 SOM: OFF' : '🔊 SOM: ON';
  soundBtn.classList.toggle('muted', muted);
  if (!muted) Sound.select();
});

document.addEventListener('pointerdown', () => { Sound.init(); Sound.resume(); }, { once: true });

let pendingMode = null;
document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => { pendingMode = btn.dataset.mode; showDeckScreen(); });
});

document.getElementById('btnOpenUpgrade').addEventListener('click', () => { showUpgradeScreen(); });
document.getElementById('btnUpgradeBack').addEventListener('click', () => {
  hideUpgradeScreen();
  document.getElementById('menu').style.display = 'flex';
  updateMenuCrystals();
  Sound.select();
});

document.getElementById('btnDeckStart').addEventListener('click', () => {
  if (selectedDeck.length !== DECK_SIZE) return;
  startGame(pendingMode);
});
document.getElementById('btnDeckDefault').addEventListener('click', () => {
  selectedDeck = ['recruta','boxeador','drone','faca','sniper','bazuca','medico','comerciante'];
  saveDeck(); buildDeckGrid(); updateDeckUI(); Sound.select();
});
document.getElementById('btnDeckClear').addEventListener('click', () => {
  selectedDeck = []; saveDeck(); buildDeckGrid(); updateDeckUI(); Sound.error();
});
document.getElementById('btnDeckBack').addEventListener('click', () => {
  hideDeckScreen(); document.getElementById('menu').style.display = 'flex'; Sound.select();
});
document.getElementById('btnMenu').addEventListener('click', () => {
  gameMode = null;
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('game').style.display = 'none';
  document.getElementById('titleBar').style.display = 'none';
  document.getElementById('mapInfoBar').style.display = 'none';
  document.getElementById('soundBtn').style.display = 'none';
  document.body.classList.remove('mode-pc', 'mode-mobile');
  updateMenuCrystals();
});

updateMenuCrystals();
requestAnimationFrame(loop);
</script>
</body>
</html>
