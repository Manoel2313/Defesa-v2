<style>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const PPM = 16;
const GREEN = '#33ff33';
const GREEN_BRIGHT = '#88ff88';
const GREEN_DIM = '#1a8a1a';
const GREEN_DARK = '#0a3a0a';
const BLACK = '#000000';
const YELLOW = '#ffff33';
const CYAN = '#33ffff';
const ICE = '#88ddff';
const RED = '#ff3333';
const FIRE = '#ff6600';
const FIRE_BRIGHT = '#ffaa33';
const WHITE = '#ffffff';
const ORANGE = '#ffaa33';
const GOLD = '#ffd700';
const TOXIC = '#66ff33';

const MAPS = [
  { name: 'ZIGUE-ZAGUE', path: [
    {x: 0, y: 64}, {x: 120, y: 64}, {x: 120, y: 180},
    {x: 300, y: 180}, {x: 300, y: 90}, {x: 420, y: 90},
    {x: 420, y: 300}, {x: 150, y: 300}, {x: 150, y: 240},
    {x: 480, y: 240}
  ]}
];

let chosenMap, path, pathWidth = 32;

let gold = 100;
let waveNum = 0;
let paused = false;
let gameOver = false;
let gameMode = null;

const PLAYER_MAX_HP = 300;
let playerHp = PLAYER_MAX_HP;

const towers = [];
const enemies = [];
const bullets = [];
const missiles = [];
const explosions = [];
const particles = [];
const trails = [];
const texts = [];
const shockwaves = [];
const sparks = [];
const heals = [];
const moneyPops = [];
const healZones = [];
const flames = []; // cones de fogo visual

let shakeAmount = 0;
const shakeDecay = 0.9;
let screenFlash = 0;
let screenFlashColor = '51,255,51';
let hordeActive = false;
let hordePulse = 0;
let dragging = null;
let selectedTowerType = null;
let pointerDownInfo = null;

const TOWER_TYPES = {
  recruta:      { cost: 50,  range: 5 * PPM,   damage: 25, fireRate: 60,  hp: 100, maxHp: 100 },
  sniper:       { cost: 150, range: 15 * PPM,  damage: 50, fireRate: 120, hp: 70,  maxHp: 70  },
  faca:         { cost: 100, range: 2.5 * PPM, damage: 80, fireRate: 30,  hp: 150, maxHp: 150 },
  metralhadora: { cost: 150, range: 7 * PPM,   damage: 25, fireRate: 12,  hp: 100, maxHp: 100 },
  lancachamas:  { cost: 180, range: 4 * PPM,   damage: 15, fireRate: 6,   hp: 100, maxHp: 100, isFlamethrower: true },
  bazuca:       { cost: 200, range: 10 * PPM,  damage: 150, fireRate: 300, hp: 100, maxHp: 100, splash: 3 * PPM },
  medico:       { cost: 250, range: 5 * PPM,   damage: 0,  fireRate: 300, hp: 100, maxHp: 100, heal: 20, isHealer: true },
  comerciante:  { baseCost: 400, cost: 400, range: 0, damage: 0, fireRate: 300, hp: 100, maxHp: 100, income: 50, isMerchant: true }
};

function getMerchantCost() {
  const aliveMerchants = towers.filter(t => t.isMerchant).length;
  return 400 + aliveMerchants * 100;
}
function getCostForType(type) {
  if (type === 'comerciante') return getMerchantCost();
  return TOWER_TYPES[type].cost;
}

function speedToPixels(vel) {
  return ((vel / 20) * PPM) / 60;
}

const ENEMY_TYPES = {
  padrao:    { hp: 100, damage: 50,  speed: 100, size: 14, reward: 12, drawStyle: 'square' },
  blindado:  { hp: 500, damage: 50,  speed: 70,  size: 18, reward: 30, armor: 5, drawStyle: 'tank' },
  ofensivo:  { hp: 90,  damage: 150, speed: 90,  size: 14, reward: 20, drawStyle: 'triangle' },
  velocista: { hp: 70,  damage: 30,  speed: 200, size: 11, reward: 15, drawStyle: 'arrow' },
  clone:     { hp: 120, damage: 60,  speed: 120, size: 14, reward: 18, drawStyle: 'diamond', onDeath: 'clone' },
  minion:    { hp: 50,  damage: 10,  speed: 80,  size: 9,  reward: 4,  drawStyle: 'dot' },
  explosivo: { hp: 100, damage: 50,  speed: 100, size: 14, reward: 20, drawStyle: 'star', onDeath: 'explode' },
  fungo:     { hp: 100, damage: 50,  speed: 100, size: 15, reward: 15, drawStyle: 'mushroom', onDeath: 'fungusZone' },
  yeti:      { hp: 500, damage: 50,  speed: 40,  size: 20, reward: 35, armor: 5, drawStyle: 'yeti', aura: 4 * PPM }
};

function getWaveComposition(wave) {
  const comp = [];
  comp.push({ type: 'padrao', count: 3 + Math.floor(wave * 0.8) });
  if (wave >= 2) comp.push({ type: 'velocista', count: 2 + Math.floor(wave * 0.5) });
  if (wave >= 3) comp.push({ type: 'ofensivo', count: 1 + Math.floor(wave * 0.4) });
  if (wave >= 4) comp.push({ type: 'explosivo', count: 1 + Math.floor(wave * 0.3) });
  if (wave >= 4) comp.push({ type: 'fungo', count: 1 + Math.floor(wave * 0.25) });
  if (wave >= 5) comp.push({ type: 'blindado', count: 1 + Math.floor(wave * 0.3) });
  if (wave >= 5) comp.push({ type: 'yeti', count: 1 + Math.floor(wave * 0.2) });
  if (wave >= 6) comp.push({ type: 'clone', count: 1 + Math.floor(wave * 0.25) });
  const queue = [];
  for (const { type, count } of comp) for (let i = 0; i < count; i++) queue.push(type);
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

function getHordeComposition(wave) {
  const comp = [];
  comp.push({ type: 'blindado',  count: 3 + Math.floor(wave * 0.4) });
  comp.push({ type: 'ofensivo',  count: 4 + Math.floor(wave * 0.5) });
  comp.push({ type: 'explosivo', count: 3 + Math.floor(wave * 0.4) });
  comp.push({ type: 'fungo',     count: 3 + Math.floor(wave * 0.4) });
  comp.push({ type: 'yeti',      count: 2 + Math.floor(wave * 0.3) });
  comp.push({ type: 'clone',     count: 2 + Math.floor(wave * 0.3) });
  comp.push({ type: 'velocista', count: 4 + Math.floor(wave * 0.6) });
  const queue = [];
  for (const { type, count } of comp) for (let i = 0; i < count; i++) queue.push(type);
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

function distToSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = a.x + t*dx, py = a.y + t*dy;
  return Math.hypot(p.x-px, p.y-py);
}
function isOnPath(x, y) {
  for (let i = 0; i < path.length - 1; i++) {
    if (distToSegment({x,y}, path[i], path[i+1]) < pathWidth/2 + 12) return true;
  }
  return false;
}
function isValidPlacement(x, y, type) {
  if (x < 14 || y < 14 || x > canvas.width - 14 || y > canvas.height - 14) return false;
  if (isOnPath(x, y)) return false;
  if (towers.some(t => Math.hypot(t.x-x, t.y-y) < 30)) return false;
  if (gold < getCostForType(type)) return false;
  return true;
}

function addParticle(x, y, opts = {}) {
  particles.push({
    x, y,
    vx: opts.vx !== undefined ? opts.vx : (Math.random() - 0.5) * 3,
    vy: opts.vy !== undefined ? opts.vy : (Math.random() - 0.5) * 3,
    life: opts.life || 30, maxLife: opts.life || 30,
    size: opts.size || 2, color: opts.color || GREEN,
    gravity: opts.gravity || 0,
    friction: opts.friction !== undefined ? opts.friction : 0.96
  });
}
function burst(x, y, count, opts = {}) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (opts.speed || 3) * (0.3 + Math.random() * 0.7);
    addParticle(x, y, {
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: opts.life || 25, size: opts.size || 2,
      color: opts.color || GREEN, gravity: opts.gravity || 0,
      friction: opts.friction || 0.94
    });
  }
}
function addTrail(x, y, color, size, life) {
  trails.push({ x, y, life: life || 12, maxLife: life || 12, color: color || GREEN, size: size || 3 });
}
function addShockwave(x, y, color, maxRadius, life) {
  shockwaves.push({ x, y, radius: 2, maxRadius: maxRadius || 40,
    life: life || 20, maxLife: life || 20, color: color || GREEN });
}
function addText(x, y, text, color, life) {
  texts.push({ x, y, text, color: color || GREEN, life: life || 40, maxLife: life || 40, vy: -0.8 });
}
function addSpark(x1, y1, x2, y2, color) {
  sparks.push({ x1, y1, x2, y2, life: 6, maxLife: 6, color: color || GREEN_BRIGHT });
}
function addShake(amount) { shakeAmount = Math.min(shakeAmount + amount, 14); }
function addFlash(amount, color) {
  screenFlash = Math.min(screenFlash + amount, 0.6);
  if (color) screenFlashColor = color;
}
function addHealEffect(x, y, amount) {
  heals.push({ x, y, life: 45, maxLife: 45, amount, radius: 12 });
  for (let i = 0; i < 6; i++) {
    addParticle(x + (Math.random() - 0.5) * 20, y, {
      vx: (Math.random() - 0.5) * 0.5, vy: -1 - Math.random(),
      life: 40, size: 2, color: GREEN_BRIGHT, friction: 0.98
    });
  }
  addText(x, y - 18, '+' + amount, GREEN_BRIGHT, 50);
}
function addEnemyHealEffect(x, y, amount) {
  addText(x, y - 15, '+' + amount, TOXIC, 35);
  for (let i = 0; i < 3; i++) {
    addParticle(x + (Math.random() - 0.5) * 12, y + (Math.random() - 0.5) * 12, {
      vx: 0, vy: -0.8 - Math.random() * 0.5,
      life: 30, size: 2, color: TOXIC, friction: 0.97
    });
  }
}
function addMoneyPop(x, y, amount) {
  moneyPops.push({ x, y, amount, life: 60, maxLife: 60, vy: -1.2, text: '+$' + amount });
  for (let i = 0; i < 8; i++) {
    addParticle(x, y, {
      vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() * 1.5,
      life: 40, size: 2, color: GOLD, friction: 0.95
    });
  }
}
function addFlameCone(x, y, angle, range) {
  flames.push({ x, y, angle, range, life: 6, maxLife: 6 });
}
function addFireParticle(enemy) {
  if (Math.random() < 0.6) {
    addParticle(
      enemy.x + (Math.random() - 0.5) * enemy.size,
      enemy.y + (Math.random() - 0.5) * enemy.size,
      {
        vx: (Math.random() - 0.5) * 0.5,
        vy: -0.8 - Math.random() * 1,
        life: 25, size: 2,
        color: Math.random() < 0.5 ? FIRE : FIRE_BRIGHT,
        friction: 0.97
      }
    );
  }
}

function damagePlayer(amount) {
  playerHp -= amount;
  if (playerHp < 0) playerHp = 0;
  addFlash(0.45, '255,51,51'); addShake(7);
  addText(canvas.width / 2, 60, '-' + amount, RED, 70);
  updateUI();
  if (playerHp <= 0) { gameOver = true; showMsg('> VOCÊ CAIU <'); }
}
function healPlayer(amount) {
  const old = playerHp;
  playerHp = Math.min(PLAYER_MAX_HP, playerHp + amount);
  const healed = playerHp - old;
  if (healed > 0) {
    addFlash(0.2, '51,255,51');
    addText(canvas.width / 2, 60, '+' + healed + ' HP', GREEN_BRIGHT, 60);
    updateUI();
  }
}

function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('wave').textContent = waveNum;
  document.getElementById('playerHpNum').textContent = playerHp;

  const pct = playerHp / PLAYER_MAX_HP;
  const bar = document.getElementById('playerHpBarInner');
  const lbl = document.getElementById('playerHpLabel');
  bar.style.width = (pct * 100) + '%';
  bar.classList.remove('mid', 'low'); lbl.classList.remove('low');
  if (pct <= 0.25) { bar.classList.add('low'); lbl.classList.add('low'); }
  else if (pct <= 0.5) { bar.classList.add('mid'); }

  const hordeInd = document.getElementById('hordeIndicator');
  if (hordeActive) hordeInd.textContent = '⚠ HORDA ATIVA ⚠';
  else if (waveNum > 0 && (waveNum + 1) % 10 === 0) hordeInd.textContent = 'PRÓXIMA: HORDA';
  else hordeInd.textContent = '';

  document.querySelectorAll('.tower-btn').forEach(btn => {
    const type = btn.dataset.type;
    const cost = getCostForType(type);
    const costEl = btn.querySelector('.cost-line');
    if (costEl) {
      costEl.textContent = cost;
      costEl.classList.toggle('expensive', gold < cost);
    }
    btn.disabled = gold < cost;
  });
}

function clearSelection() {
  selectedTowerType = null;
  dragging = null;
  document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
  canvas.style.cursor = 'crosshair';
}
function selectTowerType(type) {
  selectedTowerType = type;
  document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
  const btn = document.querySelector(`.tower-btn[data-type="${type}"]`);
  if (btn) btn.classList.add('selected');
}

function tryPlace(x, y, type) {
  if (!isValidPlacement(x, y, type)) {
    if (isOnPath(x, y)) showMsg('> ÁREA BLOQUEADA');
    else if (towers.some(t => Math.hypot(t.x-x, t.y-y) < 30)) showMsg('> MUITO PRÓXIMO');
    else if (gold < getCostForType(type)) showMsg('> CRÉDITOS INSUFICIENTES');
    return false;
  }
  const def = TOWER_TYPES[type];
  const actualCost = getCostForType(type);
  towers.push({
    x, y, type,
    cost: actualCost, range: def.range, damage: def.damage,
    fireRate: def.fireRate, splash: def.splash || 0,
    heal: def.heal || 0, isHealer: def.isHealer || false,
    income: def.income || 0, isMerchant: def.isMerchant || false,
    isFlamethrower: def.isFlamethrower || false,
    hp: def.hp, maxHp: def.maxHp,
    cooldown: 0, angle: 0,
    spawnAnim: 20, recoil: 0, healPulse: 0, incomePulse: 0
  });
  gold -= actualCost;
  addShockwave(x, y, def.isHealer ? GREEN_BRIGHT : def.isMerchant ? GOLD : def.isFlamethrower ? FIRE : GREEN, 40, 22);
  burst(x, y, 16, { speed: 3, life: 25, color: def.isHealer ? GREEN_BRIGHT : def.isMerchant ? GOLD : def.isFlamethrower ? FIRE : GREEN, size: 2 });
  addFlash(0.15);
  updateUI();
  return true;
}

document.querySelectorAll('.tower-btn').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    const type = btn.dataset.type;
    const cost = getCostForType(type);
    if (gold < cost) { showMsg('> CRÉDITOS INSUFICIENTES'); addShake(2); return; }
    pointerDownInfo = { x: e.clientX, y: e.clientY, type, source: 'button' };
  });
});

document.addEventListener('pointermove', e => {
  if (pointerDownInfo && pointerDownInfo.source === 'button' && !dragging) {
    const dx = e.clientX - pointerDownInfo.x;
    const dy = e.clientY - pointerDownInfo.y;
    if (Math.hypot(dx, dy) > 8) {
      const type = pointerDownInfo.type;
      dragging = { type, def: TOWER_TYPES[type], x: 0, y: 0, valid: false, overCanvas: false };
      canvas.style.cursor = 'grabbing';
      selectTowerType(type);
    }
  }
  if (dragging) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
    dragging.overCanvas = (cx >= 0 && cx <= canvas.width && cy >= 0 && cy <= canvas.height);
    dragging.x = cx;
    dragging.y = cy;
    dragging.valid = dragging.overCanvas && isValidPlacement(cx, cy, dragging.type);
  }
});

document.addEventListener('pointerup', e => {
  if (dragging) {
    const d = dragging;
    dragging = null;
    canvas.style.cursor = 'crosshair';
    if (d.overCanvas) {
      const ok = tryPlace(d.x, d.y, d.type);
      if (ok) clearSelection();
      else selectTowerType(d.type);
    } else selectTowerType(d.type);
    pointerDownInfo = null;
    return;
  }
  if (pointerDownInfo && pointerDownInfo.source === 'button') {
    const moved = Math.hypot(e.clientX - pointerDownInfo.x, e.clientY - pointerDownInfo.y);
    if (moved < 8) {
      const type = pointerDownInfo.type;
      if (selectedTowerType === type) clearSelection();
      else selectTowerType(type);
    }
    pointerDownInfo = null;
  }
});

canvas.addEventListener('pointerdown', e => {
  if (dragging) return;
  if (!selectedTowerType) return;
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
  const ok = tryPlace(cx, cy, selectedTowerType);
  if (ok) clearSelection();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') clearSelection();
  if (e.code === 'Space') {
    e.preventDefault();
    if (!gameOver && gameMode) paused = !paused;
  }
});

function showMsg(text) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.style.display = 'block';
  clearTimeout(m._t);
  m._t = setTimeout(() => m.style.display = 'none', 1300);
}
function showHordeBanner() {
  const b = document.getElementById('hordeBanner');
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}

function spawnEnemy(typeKey, x, y, wp) {
  const t = ENEMY_TYPES[typeKey];
  const hpScale = 1 + (waveNum - 1) * 0.15;
  const hp = Math.floor(t.hp * hpScale);
  const ex = x !== undefined ? x : path[0].x;
  const ey = y !== undefined ? y : path[0].y;
  let startWp = wp !== undefined ? wp : 1;
  if (startWp < 1) startWp = 1;
  if (startWp >= path.length) startWp = path.length - 1;

  enemies.push({
    type: typeKey, x: ex, y: ey, wp: startWp,
    hp, maxHp: hp, damage: t.damage,
    speed: speedToPixels(t.speed), baseSpeed: speedToPixels(t.speed),
    frozen: 0, reward: hordeActive ? t.reward * 2 : t.reward,
    size: t.size, armor: t.armor || 0,
    drawStyle: t.drawStyle, onDeath: t.onDeath || null,
    aura: t.aura || 0,
    fireTimer: 0, fireTickTimer: 0, // efeito de queimadura
    spawnAnim: 15, hitFlash: 0, lastTrailTime: 0, lastHealTick: 0
  });
  addShockwave(ex, ey, hordeActive ? RED : GREEN, 20, 12);
  burst(ex, ey, 6, { speed: 1.5, life: 15, size: 1.5 });
}

let waveQueue = [];
let spawnCooldown = 0;
let waveDelay = 0;
let waveActive = false;

function startWave() {
  waveNum++;
  const isHorde = (waveNum % 10 === 0);
  if (isHorde) {
    hordeActive = true;
    waveQueue = getHordeComposition(waveNum);
    showHordeBanner();
    addFlash(0.5, '255,51,51'); addShake(10);
    setTimeout(showHordeBanner, 100);
  } else {
    hordeActive = false;
    waveQueue = getWaveComposition(waveNum);
  }
  spawnCooldown = 0;
  waveActive = true;
  if (!isHorde) {
    addShockwave(240, 240, GREEN, 300, 40);
    addFlash(0.2); addShake(3);
  } else {
    addShockwave(240, 240, RED, 400, 60);
  }
  updateUI();
}

function areaExplosion(x, y, damage, radius) {
  addShockwave(x, y, GREEN, radius, 25);
  addShockwave(x, y, YELLOW, radius * 0.6, 18);
  addShockwave(x, y, GREEN, radius * 1.3, 35);
  burst(x, y, 40, { speed: 6, life: 40, size: 3, gravity: 0.2, friction: 0.92 });
  burst(x, y, 20, { speed: 9, life: 25, size: 2, color: YELLOW, friction: 0.9 });
  addFlash(0.5); addShake(8);
  const inRange = towers.filter(t => Math.hypot(t.x - x, t.y - y) <= radius);
  for (const t of inRange) {
    t.hp -= damage;
    addText(t.x, t.y - 15, '-' + damage, YELLOW, 45);
    if (t.hp <= 0) {
      addShockwave(t.x, t.y, GREEN, 60, 30);
      burst(t.x, t.y, 30, { speed: 5, life: 35, size: 3 });
      const idx = towers.indexOf(t);
      if (idx >= 0) towers.splice(idx, 1);
      if (t.isHealer) healPlayer(5);
    }
  }
  updateUI();
}

function damageEnemy(e, amount, fromX, fromY, isFire) {
  const real = Math.max(1, amount - (e.armor || 0));
  e.hp -= real; e.hitFlash = 6;
  if (!isFire) {
    burst(e.x, e.y, 5, { speed: 2, life: 12, size: 1.5, color: GREEN_BRIGHT });
  }
  addText(e.x, e.y - e.size - 5, '-' + real, isFire ? FIRE_BRIGHT : GREEN_BRIGHT, 30);
  if (fromX !== undefined && fromY !== undefined) addSpark(fromX, fromY, e.x, e.y, GREEN_BRIGHT);
}

function applyFire(e) {
  // Renova o tempo de queimadura
  e.fireTimer = 5 * 60; // 5 segundos
  e.fireTickTimer = 0;
}

function bazookaExplosion(x, y, damage, radius) {
  addShockwave(x, y, ORANGE, radius, 22);
  addShockwave(x, y, YELLOW, radius * 0.7, 16);
  addShockwave(x, y, GREEN, radius * 1.3, 30);
  burst(x, y, 50, { speed: 7, life: 40, size: 3, gravity: 0.15, friction: 0.9 });
  burst(x, y, 25, { speed: 11, life: 25, size: 2, color: YELLOW, friction: 0.88 });
  burst(x, y, 15, { speed: 4, life: 45, size: 4, color: ORANGE, gravity: 0.08 });
  addFlash(0.55); addShake(9);
  const inRange = enemies.filter(e => Math.hypot(e.x - x, e.y - y) <= radius);
  for (const e of inRange) {
    const dist = Math.hypot(e.x - x, e.y - y);
    const falloff = 1 - (dist / radius) * 0.6;
    damageEnemy(e, Math.floor(damage * falloff));
  }
}

function findCorrectWaypointForPosition(x, y) {
  let bestSegIdx = 0, bestDist = Infinity;
  for (let i = 0; i < path.length - 1; i++) {
    const d = distToSegment({x, y}, path[i], path[i+1]);
    if (d < bestDist) { bestDist = d; bestSegIdx = i; }
  }
  return Math.min(bestSegIdx + 1, path.length - 1);
}

function spawnCloneMinions(x, y, parentWp) {
  const parentAngle = parentWp < path.length
    ? Math.atan2(path[parentWp].y - path[parentWp - 1].y, path[parentWp].x - path[parentWp - 1].x)
    : 0;
  for (let i = 0; i < 5; i++) {
    const spreadAngle = (Math.PI * 2 / 5) * i;
    const offsetAngle = parentAngle + Math.PI / 2;
    const perpX = Math.cos(offsetAngle) * 18 * Math.cos(spreadAngle);
    const perpY = Math.sin(offsetAngle) * 18 * Math.cos(spreadAngle);
    const fwdX = Math.cos(parentAngle) * 18 * Math.sin(spreadAngle);
    const fwdY = Math.sin(parentAngle) * 18 * Math.sin(spreadAngle);
    const mx = x + perpX + fwdX;
    const my = y + perpY + fwdY;
    const wp = findCorrectWaypointForPosition(mx, my);
    spawnEnemy('minion', mx, my, wp);
  }
  addShockwave(x, y, CYAN, 40, 22);
  burst(x, y, 20, { speed: 4, life: 30, color: CYAN, size: 2 });
  addFlash(0.2);
}

function spawnFungusZone(x, y) {
  healZones.push({ x, y, radius: 8 * PPM, life: 4 * 60, maxLife: 4 * 60, pulse: 0 });
  addShockwave(x, y, TOXIC, 8 * PPM, 45);
  burst(x, y, 25, { speed: 4, life: 40, size: 3, color: TOXIC, gravity: 0.05 });
  addFlash(0.15, '102,255,51');
}

let lastTime = 0;
function loop(time) {
  requestAnimationFrame(loop);
  if (!gameMode) return;
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;

  if (paused || gameOver) { draw(); return; }

  if (waveActive && waveQueue.length > 0) {
    spawnCooldown -= dt;
    if (spawnCooldown <= 0) {
      spawnEnemy(waveQueue.shift());
      spawnCooldown = hordeActive ? 18 : 45;
    }
  } else if (waveActive && waveQueue.length === 0 && enemies.length === 0) {
    waveActive = false; hordeActive = false; waveDelay = 90;
  }
  if (waveDelay > 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) startWave();
  }

  for (const t of towers) t.frozenByYeti = false;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.spawnAnim > 0) e.spawnAnim -= dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.frozen > 0) { e.frozen -= dt; e.speed = e.baseSpeed * 0.3; } else e.speed = e.baseSpeed;
    e.lastTrailTime -= dt;
    if (e.lastTrailTime <= 0 && e.speed > 0.5) {
      addTrail(e.x, e.y, hordeActive ? RED : GREEN, e.size * 0.5, 10);
      e.lastTrailTime = 4;
    }

    // QUEIMADURA
    if (e.fireTimer > 0) {
      e.fireTimer -= dt;
      e.fireTickTimer += dt;
      addFireParticle(e);
      // 10 dano por segundo (60 ticks)
      if (e.fireTickTimer >= 60) {
        e.fireTickTimer -= 60;
        damageEnemy(e, 10, undefined, undefined, true);
      }
      if (e.fireTimer <= 0) e.fireTimer = 0;
    }

    if (e.aura > 0) {
      for (const t of towers) {
        if (Math.hypot(t.x - e.x, t.y - e.y) <= e.aura) t.frozenByYeti = true;
      }
      if (Math.random() < 0.15) {
        const angle = Math.random() * Math.PI * 2;
        const r = e.aura * (0.5 + Math.random() * 0.5);
        addParticle(e.x + Math.cos(angle) * r, e.y + Math.sin(angle) * r, {
          vx: (Math.random() - 0.5) * 0.5, vy: -0.5 - Math.random() * 0.5,
          life: 30, size: 2, color: ICE, friction: 0.97
        });
      }
    }

    const target = path[e.wp];
    if (!target) {
      damagePlayer(e.damage);
      burst(e.x, e.y, 14, { speed: 4, life: 22, size: 2, color: RED });
      addShockwave(e.x, e.y, RED, 30, 18);
      enemies.splice(i, 1); continue;
    }
    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < e.speed * dt) { e.x = target.x; e.y = target.y; e.wp++; }
    else { e.x += (dx/dist) * e.speed * dt; e.y += (dy/dist) * e.speed * dt; }

    if (e.hp <= 0) {
      gold += e.reward;
      addShockwave(e.x, e.y, e.type === 'yeti' ? ICE : GREEN, 25, 15);
      burst(e.x, e.y, e.type === 'yeti' ? 20 : 12, {
        speed: 3, life: 22, size: 2,
        color: e.type === 'yeti' ? ICE : GREEN
      });
      addText(e.x, e.y - e.size - 5, '+' + e.reward, YELLOW, 40);
      if (e.onDeath === 'clone') spawnCloneMinions(e.x, e.y, e.wp);
      else if (e.onDeath === 'explode') areaExplosion(e.x, e.y, 50, 4 * PPM);
      else if (e.onDeath === 'fungusZone') spawnFungusZone(e.x, e.y);
      enemies.splice(i, 1); updateUI();
    }
  }

  for (let i = healZones.length - 1; i >= 0; i--) {
    const z = healZones[i];
    z.life -= dt; z.pulse += dt * 0.15;
    if (z.life <= 0) { healZones.splice(i, 1); continue; }
    for (const e of enemies) {
      const d = Math.hypot(e.x - z.x, e.y - z.y);
      if (d <= z.radius) {
        const healThisFrame = 10 / 60 * dt;
        e.hp = Math.min(e.maxHp, e.hp + healThisFrame);
        e.lastHealTick = (e.lastHealTick || 0) + dt;
        if (e.lastHealTick >= 60 && e.hp < e.maxHp) { addEnemyHealEffect(e.x, e.y, 10); e.lastHealTick = 0; }
        if (e.hp >= e.maxHp) e.lastHealTick = 0;
      } else e.lastHealTick = 0;
    }
  }

  for (const t of towers) {
    if (t.spawnAnim > 0) t.spawnAnim -= dt;
    if (t.recoil > 0) t.recoil -= dt * 3;
    if (t.healPulse > 0) t.healPulse -= dt * 2;
    if (t.incomePulse > 0) t.incomePulse -= dt * 2;

    const cooldownSpeed = t.frozenByYeti ? (1/3) : 1;
    t.cooldown -= dt * cooldownSpeed;

    if (t.isHealer) {
      if (t.cooldown <= 0) {
        const targets = towers.filter(o => Math.hypot(o.x - t.x, o.y - t.y) <= t.range);
        let healedAny = false;
        for (const o of targets) {
          if (o.hp < o.maxHp) {
            const healed = Math.min(t.heal, o.maxHp - o.hp);
            o.hp += healed;
            if (healed > 0) { addHealEffect(o.x, o.y, t.heal); healedAny = true; }
          }
        }
        if (healedAny) { addShockwave(t.x, t.y, GREEN_BRIGHT, t.range, 30); t.healPulse = 1; updateUI(); }
        t.cooldown = t.fireRate;
      }
      continue;
    }

    if (t.isMerchant) {
      if (t.cooldown <= 0) {
        gold += t.income;
        addMoneyPop(t.x, t.y - 15, t.income);
        addShockwave(t.x, t.y, GOLD, 35, 25);
        burst(t.x, t.y, 12, { speed: 2, life: 35, color: GOLD, size: 2 });
        t.incomePulse = 1;
        updateUI(); t.cooldown = t.fireRate;
      }
      continue;
    }

    // Encontra alvo
    let target = null, bestDist = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x - t.x, e.y - t.y);
      if (d < t.range && d < bestDist) { bestDist = d; target = e; }
    }
    if (target) {
      t.angle = Math.atan2(target.y - t.y, target.x - t.x);
      if (t.cooldown <= 0) {
        const mx = t.x + Math.cos(t.angle) * 14;
        const my = t.y + Math.sin(t.angle) * 14;

        if (t.isFlamethrower) {
          // Lança-chamas: cone visual + dano imediato + aplica fogo
          addFlameCone(t.x, t.y, t.angle, t.range);
          // Dano imediato no alvo
          damageEnemy(target, t.damage, t.x, t.y);
          // Aplica/renova queimadura
          applyFire(target);
          // Pequeno burst de fogo na boca
          burst(mx, my, 6, { speed: 2.5, life: 15, size: 2, color: FIRE });
          t.recoil = 2;
        } else if (t.type === 'bazuca') {
          burst(mx, my, 8, { speed: 3, life: 14, size: 2, color: ORANGE });
          addShockwave(mx, my, ORANGE, 12, 12);
          missiles.push({ x: t.x, y: t.y, target, damage: t.damage, splash: t.splash, speed: 6, angle: t.angle, life: 300 });
          t.recoil = 6;
        } else {
          burst(mx, my, 5, { speed: 2, life: 10, size: 1.5, color: GREEN_BRIGHT });
          addShockwave(mx, my, GREEN, 8, 8);
          t.recoil = 4;
          bullets.push({ x: t.x, y: t.y, target, damage: t.damage, speed: 8, type: t.type, angle: t.angle });
        }
        t.cooldown = t.fireRate;
      }
    }
  }

  // Mísseis
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    m.life -= dt;
    addTrail(m.x, m.y, ORANGE, 4, 14);
    addTrail(m.x + (Math.random()-0.5)*4, m.y + (Math.random()-0.5)*4, YELLOW, 2, 8);
    if (Math.random() < 0.5) {
      addParticle(m.x, m.y, { vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
        life: 20, size: 2, color: ORANGE, friction: 0.95 });
    }
    if (!m.target || m.target.hp <= 0 || enemies.indexOf(m.target) === -1) {
      bazookaExplosion(m.x, m.y, m.damage, m.splash); missiles.splice(i, 1); continue;
    }
    const desiredAngle = Math.atan2(m.target.y - m.y, m.target.x - m.x);
    let diff = desiredAngle - m.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    m.angle += Math.max(-0.12, Math.min(0.12, diff)) * dt;
    const dx = m.target.x - m.x, dy = m.target.y - m.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 12 || m.life <= 0) { bazookaExplosion(m.x, m.y, m.damage, m.splash); missiles.splice(i, 1); continue; }
    m.x += Math.cos(m.angle) * m.speed * dt;
    m.y += Math.sin(m.angle) * m.speed * dt;
  }

  // Projéteis
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    addTrail(b.x, b.y, b.type === 'sniper' ? CYAN : GREEN, b.type === 'faca' ? 3 : 2, 10);
    if (!b.target || b.target.hp <= 0 || enemies.indexOf(b.target) === -1) {
      burst(b.x, b.y, 4, { speed: 1.5, life: 10, size: 1.5 }); bullets.splice(i, 1); continue;
    }
    if (b.type === 'sniper') {
      damageEnemy(b.target, b.damage, b.x, b.y);
      addShockwave(b.target.x, b.target.y, CYAN, 15, 10);
      burst(b.target.x, b.target.y, 8, { speed: 3, life: 15, size: 2, color: CYAN });
      addFlash(0.08); bullets.splice(i, 1); continue;
    }
    const dx = b.target.x - b.x, dy = b.target.y - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist < b.speed * dt) {
      damageEnemy(b.target, b.damage, b.x, b.y);
      if (b.type === 'faca') {
        burst(b.target.x, b.target.y, 12, { speed: 4, life: 18, size: 2.5 });
        addShockwave(b.target.x, b.target.y, GREEN, 18, 12); addShake(1.5);
      } else if (b.type === 'metralhadora') {
        burst(b.target.x, b.target.y, 4, { speed: 2.5, life: 10, size: 1.5 });
      }
      bullets.splice(i, 1);
    } else { b.x += (dx/dist) * b.speed * dt; b.y += (dy/dist) * b.speed * dt; }
  }

  // Partículas, trails, shockwaves, sparks, texts, heals, moneyPops, flames
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= p.friction; p.vy *= p.friction; p.vy += p.gravity * dt;
    p.life -= dt; if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = trails.length - 1; i >= 0; i--) { trails[i].life -= dt; if (trails[i].life <= 0) trails.splice(i, 1); }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i]; s.life -= dt;
    const p = 1 - (s.life / s.maxLife); s.radius = s.maxRadius * p;
    if (s.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) { sparks[i].life -= dt; if (sparks[i].life <= 0) sparks.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) {
    const tx = texts[i]; tx.y += tx.vy * dt; tx.vy *= 0.97; tx.life -= dt;
    if (tx.life <= 0) texts.splice(i, 1);
  }
  for (let i = heals.length - 1; i >= 0; i--) { heals[i].life -= dt; if (heals[i].life <= 0) heals.splice(i, 1); }
  for (let i = moneyPops.length - 1; i >= 0; i--) {
    const mp = moneyPops[i]; mp.y += mp.vy * dt; mp.vy *= 0.97; mp.life -= dt;
    if (mp.life <= 0) moneyPops.splice(i, 1);
  }
  for (let i = flames.length - 1; i >= 0; i--) {
    flames[i].life -= dt;
    if (flames[i].life <= 0) flames.splice(i, 1);
  }
  for (let i = explosions.length - 1; i >= 0; i--) { explosions[i].life -= dt; if (explosions[i].life <= 0) explosions.splice(i, 1); }

  shakeAmount *= shakeDecay; if (shakeAmount < 0.1) shakeAmount = 0;
  screenFlash *= 0.88; if (screenFlash < 0.01) screenFlash = 0;
  if (hordeActive) hordePulse += dt * 0.05;

  draw();
}

function draw() {
  ctx.save();
  if (shakeAmount > 0.1) {
    const sx = (Math.random() - 0.5) * shakeAmount;
    const sy = (Math.random() - 0.5) * shakeAmount;
    ctx.translate(sx, sy);
  }
  ctx.fillStyle = BLACK;
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

  ctx.strokeStyle = 'rgba(51,255,51,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += PPM) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y <= canvas.height; y += PPM) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(51,255,51,0.15)';
  for (let x = 0; x <= canvas.width; x += PPM * 5) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y <= canvas.height; y += PPM * 5) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

  for (const z of healZones) {
    const p = z.life / z.maxLife;
    ctx.globalAlpha = 0.15 * p + Math.sin(z.pulse) * 0.05;
    ctx.fillStyle = TOXIC;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.6 * p; ctx.strokeStyle = TOXIC; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;

  for (const e of enemies) {
    if (e.aura > 0) {
      const pulse = 0.6 + Math.sin(Date.now() / 300) * 0.2;
      ctx.globalAlpha = 0.12 * pulse;
      ctx.fillStyle = ICE;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.aura, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.5 * pulse;
      ctx.strokeStyle = ICE; ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.aura, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  const pulse = 0.15 + Math.sin(Date.now() / 400) * 0.03;
  ctx.strokeStyle = hordeActive ? RED : GREEN;
  ctx.lineWidth = pathWidth; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
  ctx.globalAlpha = hordeActive ? (pulse + 0.1) : pulse;
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);

  for (const tr of trails) {
    const p = tr.life / tr.maxLife;
    ctx.globalAlpha = p * 0.7; ctx.fillStyle = tr.color;
    ctx.fillRect(tr.x - tr.size/2, tr.y - tr.size/2, tr.size, tr.size);
  }
  ctx.globalAlpha = 1;

  // Cones de fogo
  for (const f of flames) {
    const p = f.life / f.maxLife;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.angle);
    ctx.globalAlpha = p * 0.75;
    // Gradiente laranja → amarelo → transparente
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, f.range);
    grad.addColorStop(0, 'rgba(255,255,150,1)');
    grad.addColorStop(0.3, 'rgba(255,170,50,0.9)');
    grad.addColorStop(0.7, 'rgba(255,100,0,0.6)');
    grad.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = grad;
    // Cone (semicírculo aberto)
    const spread = Math.PI / 6; // 30°
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, f.range, -spread, spread);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Tropas
  for (const t of towers) {
    const isFrozenByYeti = t.frozenByYeti;

    if (t.isHealer) {
      const healAlpha = t.healPulse > 0 ? 0.4 : 0.15;
      const pulseSize = t.healPulse > 0 ? 1 + t.healPulse * 0.3 : 1;
      ctx.strokeStyle = isFrozenByYeti ? ICE : GREEN_BRIGHT;
      ctx.globalAlpha = healAlpha; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range * pulseSize, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.05 * pulseSize;
      ctx.fillStyle = isFrozenByYeti ? ICE : GREEN_BRIGHT;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (t.isMerchant) {
      const merchantAlpha = t.incomePulse > 0 ? 0.5 : 0.2;
      const pulseSize = t.incomePulse > 0 ? 1 + t.incomePulse * 0.4 : 1;
      ctx.strokeStyle = isFrozenByYeti ? ICE : GOLD;
      ctx.globalAlpha = merchantAlpha; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.x, t.y, 25 * pulseSize, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.08; ctx.fillStyle = isFrozenByYeti ? ICE : GOLD;
      ctx.beginPath(); ctx.arc(t.x, t.y, 30, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = isFrozenByYeti ? 'rgba(136,221,255,0.4)' : (t.isFlamethrower ? 'rgba(255,100,0,0.3)' : 'rgba(51,255,51,0.25)');
      ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    const hpPct = t.hp / t.maxHp;
    let col;
    if (isFrozenByYeti) col = ICE;
    else if (t.isHealer) col = hpPct > 0.5 ? GREEN_BRIGHT : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isMerchant) col = hpPct > 0.5 ? GOLD : hpPct > 0.25 ? YELLOW : ORANGE;
    else if (t.isFlamethrower) col = hpPct > 0.5 ? FIRE : hpPct > 0.25 ? YELLOW : ORANGE;
    else col = hpPct > 0.5 ? GREEN : hpPct > 0.25 ? YELLOW : ORANGE;

    let scale = 1;
    if (t.spawnAnim > 0) scale = 0.5 + (1 - t.spawnAnim / 20) * 0.5;

    ctx.save();
    ctx.translate(t.x, t.y); ctx.scale(scale, scale);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.strokeRect(-11, -11, 22, 22);
    ctx.beginPath();
    ctx.moveTo(-11, -11); ctx.lineTo(-6, -11);
    ctx.moveTo(-11, -11); ctx.lineTo(-11, -6);
    ctx.moveTo(11, -11); ctx.lineTo(6, -11);
    ctx.moveTo(11, -11); ctx.lineTo(11, -6);
    ctx.moveTo(-11, 11); ctx.lineTo(-6, 11);
    ctx.moveTo(-11, 11); ctx.lineTo(-11, 6);
    ctx.moveTo(11, 11); ctx.lineTo(6, 11);
    ctx.moveTo(11, 11); ctx.lineTo(11, 6);
    ctx.stroke();

    if (!t.isHealer && !t.isMerchant) {
      const recoilOffset = t.recoil > 0 ? -t.recoil : 0;
      ctx.rotate(t.angle); ctx.fillStyle = col;
      if (t.type === 'bazuca') {
        ctx.fillRect(11 + recoilOffset, -3, 14, 6);
        ctx.fillRect(22 + recoilOffset, -4, 4, 8);
      } else if (t.type === 'metralhadora') {
        ctx.fillRect(11 + recoilOffset, -2, 14, 2);
        ctx.fillRect(11 + recoilOffset, 0, 14, 2);
      } else if (t.isFlamethrower) {
        ctx.fillRect(11 + recoilOffset, -3, 14, 6);
        // Bico do lança-chamas
        ctx.fillRect(23 + recoilOffset, -5, 4, 10);
      } else {
        ctx.fillRect(11 + recoilOffset, -2, 12, 4);
      }
    }
    ctx.restore();

    ctx.fillStyle = col;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (t.isHealer) {
      ctx.shadowColor = isFrozenByYeti ? ICE : GREEN_BRIGHT;
      ctx.shadowBlur = t.healPulse > 0 ? 15 : 6;
      ctx.fillRect(t.x - 2, t.y - 8, 4, 16);
      ctx.fillRect(t.x - 8, t.y - 2, 16, 4);
      ctx.shadowBlur = 0;
    } else if (t.isMerchant) {
      ctx.font = 'bold 16px VT323, monospace';
      ctx.shadowColor = isFrozenByYeti ? ICE : GOLD;
      ctx.shadowBlur = t.incomePulse > 0 ? 15 : 6;
      ctx.fillText('$', t.x, t.y + 1); ctx.shadowBlur = 0;
    } else if (t.isFlamethrower) {
      // Chama desenhada no centro
      ctx.shadowColor = FIRE;
      ctx.shadowBlur = 10;
      ctx.fillStyle = FIRE_BRIGHT;
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - 7);
      ctx.lineTo(t.x - 5, t.y + 3);
      ctx.lineTo(t.x - 2, t.y + 3);
      ctx.lineTo(t.x - 2, t.y + 7);
      ctx.lineTo(t.x + 2, t.y + 7);
      ctx.lineTo(t.x + 2, t.y + 3);
      ctx.lineTo(t.x + 5, t.y + 3);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.font = 'bold 13px VT323, monospace';
      const sym = t.type === 'recruta' ? 'R' : t.type === 'sniper' ? 'S' : t.type === 'faca' ? 'F' : t.type === 'metralhadora' ? 'M' : 'B';
      ctx.fillText(sym, t.x, t.y + 1);
    }

    if (isFrozenByYeti) {
      ctx.strokeStyle = ICE;
      ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 200) * 0.3;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(t.x, t.y, 17, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      for (let k = 0; k < 4; k++) {
        const ang = (Math.PI / 2) * k + Date.now() / 800;
        const px = t.x + Math.cos(ang) * 15;
        const py = t.y + Math.sin(ang) * 15;
        ctx.fillStyle = ICE;
        ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
      }
    }

    const bw = 26, bh = 3, bx = t.x - bw/2, by = t.y + 15;
    ctx.fillStyle = GREEN_DARK; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = col; ctx.fillRect(bx, by, bw * hpPct, bh);

    if (hpPct < 0.3 && Math.floor(Date.now() / 200) % 2 === 0) {
      ctx.strokeStyle = YELLOW; ctx.lineWidth = 1;
      ctx.strokeRect(t.x - 13, t.y - 13, 26, 26);
    }
  }

  for (const sp of sparks) {
    const p = sp.life / sp.maxLife;
    ctx.strokeStyle = sp.color; ctx.globalAlpha = p; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sp.x1, sp.y1); ctx.lineTo(sp.x2, sp.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const s of shockwaves) {
    const p = s.life / s.maxLife;
    ctx.strokeStyle = s.color; ctx.globalAlpha = p * 0.8;
    ctx.lineWidth = 2 + (1 - p) * 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const b of bullets) {
    if (b.type === 'sniper') {
      if (b.target) {
        const grad = ctx.createLinearGradient(b.x, b.y, b.target.x, b.target.y);
        grad.addColorStop(0, 'rgba(51,255,255,0.9)');
        grad.addColorStop(1, 'rgba(51,255,255,0.1)');
        ctx.strokeStyle = grad; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.target.x, b.target.y); ctx.stroke();
      }
    } else if (b.type === 'metralhadora') {
      ctx.fillStyle = YELLOW; ctx.shadowColor = YELLOW; ctx.shadowBlur = 6;
      ctx.fillRect(b.x - 2, b.y - 2, 4, 4); ctx.shadowBlur = 0;
    } else {
      const p = 0.7 + Math.sin(Date.now() / 60) * 0.3;
      ctx.fillStyle = GREEN_BRIGHT; ctx.shadowColor = GREEN; ctx.shadowBlur = 8 * p;
      const s = b.type === 'faca' ? 5 : 3;
      ctx.fillRect(b.x - s/2, b.y - s/2, s, s); ctx.shadowBlur = 0;
    }
  }

  for (const m of missiles) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle);
    ctx.fillStyle = ORANGE; ctx.shadowColor = ORANGE; ctx.shadowBlur = 12;
    ctx.fillRect(-8, -3, 16, 6);
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(14, 0); ctx.lineTo(8, 3); ctx.closePath(); ctx.fill();
    const flameLen = 6 + Math.random() * 4;
    ctx.beginPath(); ctx.moveTo(-8, -3); ctx.lineTo(-8 - flameLen, 0); ctx.lineTo(-8, 3); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
  }

  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  for (const h of heals) {
    const p = h.life / h.maxLife;
    const size = 6 + (1 - p) * 4;
    ctx.globalAlpha = p; ctx.fillStyle = GREEN_BRIGHT;
    ctx.shadowColor = GREEN_BRIGHT; ctx.shadowBlur = 10;
    ctx.fillRect(h.x - size/4, h.y - size, size/2, size * 2);
    ctx.fillRect(h.x - size, h.y - size/4, size * 2, size/2);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  for (const e of enemies) drawEnemy(e);

  for (const tx of texts) {
    const alpha = tx.life / tx.maxLife;
    ctx.globalAlpha = alpha; ctx.fillStyle = tx.color;
    ctx.font = tx.text.length > 4 && tx.text.startsWith('-') && parseInt(tx.text.slice(1)) > 100
      ? 'bold 22px VT323, monospace' : 'bold 14px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = tx.color; ctx.shadowBlur = 6;
    ctx.fillText(tx.text, tx.x, tx.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  for (const mp of moneyPops) {
    const alpha = mp.life / mp.maxLife;
    ctx.globalAlpha = alpha; ctx.fillStyle = GOLD;
    ctx.font = 'bold 18px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = GOLD; ctx.shadowBlur = 10;
    ctx.fillText(mp.text, mp.x, mp.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  if (dragging && dragging.overCanvas) {
    const d = dragging;
    const col = d.valid ? WHITE : RED;
    const isHealer = d.type === 'medico';
    const isMerchant = d.type === 'comerciante';
    const isFlame = d.type === 'lancachamas';

    ctx.strokeStyle = col; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(d.x, d.y, d.def.range || 30, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.08; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.def.range || 30, 0, Math.PI * 2); ctx.fill();

    if (d.type === 'bazuca') {
      ctx.globalAlpha = 0.15; ctx.strokeStyle = ORANGE; ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.def.splash, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.globalAlpha = 0.9; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.strokeRect(d.x - 11, d.y - 11, 22, 22);
    ctx.beginPath();
    ctx.moveTo(d.x - 11, d.y - 11); ctx.lineTo(d.x - 6, d.y - 11);
    ctx.moveTo(d.x - 11, d.y - 11); ctx.lineTo(d.x - 11, d.y - 6);
    ctx.moveTo(d.x + 11, d.y - 11); ctx.lineTo(d.x + 6, d.y - 11);
    ctx.moveTo(d.x + 11, d.y - 11); ctx.lineTo(d.x + 11, d.y - 6);
    ctx.moveTo(d.x - 11, d.y + 11); ctx.lineTo(d.x - 6, d.y + 11);
    ctx.moveTo(d.x - 11, d.y + 11); ctx.lineTo(d.x - 11, d.y + 6);
    ctx.moveTo(d.x + 11, d.y + 11); ctx.lineTo(d.x + 6, d.y + 11);
    ctx.moveTo(d.x + 11, d.y + 11); ctx.lineTo(d.x + 11, d.y + 6);
    ctx.stroke();

    if (isHealer) {
      ctx.fillStyle = col;
      ctx.fillRect(d.x - 2, d.y - 8, 4, 16);
      ctx.fillRect(d.x - 8, d.y - 2, 16, 4);
    } else if (isMerchant) {
      ctx.fillStyle = col; ctx.font = 'bold 16px VT323, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', d.x, d.y + 1);
    } else if (isFlame) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y - 7);
      ctx.lineTo(d.x - 5, d.y + 3);
      ctx.lineTo(d.x - 2, d.y + 3);
      ctx.lineTo(d.x - 2, d.y + 7);
      ctx.lineTo(d.x + 2, d.y + 7);
      ctx.lineTo(d.x + 2, d.y + 3);
      ctx.lineTo(d.x + 5, d.y + 3);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = col; ctx.fillRect(11, -2, 12, 4); ctx.restore();
      ctx.fillStyle = col; ctx.font = 'bold 13px VT323, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const sym = d.type === 'recruta' ? 'R' : d.type === 'sniper' ? 'S' : d.type === 'faca' ? 'F' : d.type === 'metralhadora' ? 'M' : 'B';
      ctx.fillText(sym, d.x, d.y + 1);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  if (screenFlash > 0.01) {
    ctx.fillStyle = `rgba(${screenFlashColor},${screenFlash})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (hordeActive) {
    const pulseAmount = 0.15 + Math.sin(hordePulse) * 0.15;
    const grad = ctx.createRadialGradient(240, 240, 180, 240, 240, 300);
    grad.addColorStop(0, 'rgba(255,51,51,0)');
    grad.addColorStop(1, `rgba(255,51,51,${pulseAmount})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const vg = ctx.createRadialGradient(240, 240, 150, 240, 240, 340);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = GREEN; ctx.font = 'bold 48px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = GREEN; ctx.shadowBlur = 20;
    ctx.fillText('|| PAUSA ||', canvas.width/2, canvas.height/2);
    ctx.shadowBlur = 0;
  }
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = RED; ctx.font = 'bold 48px VT323, monospace';
    ctx.textAlign = 'center'; ctx.shadowColor = RED; ctx.shadowBlur = 25;
    ctx.fillText('VOCÊ CAIU', canvas.width/2, canvas.height/2 - 20);
    ctx.fillStyle = GREEN; ctx.font = '28px VT323, monospace';
    ctx.shadowColor = GREEN; ctx.shadowBlur = 15;
    ctx.fillText('ONDA ' + waveNum, canvas.width/2, canvas.height/2 + 30);
    ctx.shadowBlur = 0;
  }
}

function drawEnemy(e) {
  const s = e.size;
  const isFrozen = e.frozen > 0;
  const isHit = e.hitFlash > 0;
  const isYeti = e.type === 'yeti';
  const isBurning = e.fireTimer > 0;

  let color;
  if (isHit) color = '#ffffff';
  else if (isFrozen) color = CYAN;
  else if (isBurning) color = FIRE_BRIGHT;
  else if (isYeti) color = ICE;
  else if (e.type === 'fungo') color = TOXIC;
  else color = hordeActive ? '#ff5555' : GREEN;

  let scale = 1;
  if (e.spawnAnim > 0) scale = 0.3 + (1 - e.spawnAnim / 15) * 0.7;

  // Glow laranja se queimando
  if (isBurning && !isHit) {
    ctx.shadowColor = FIRE;
    ctx.shadowBlur = 12;
  }

  ctx.save();
  ctx.translate(e.x, e.y); ctx.scale(scale, scale);
  ctx.strokeStyle = color;
  ctx.fillStyle = isHit ? color : BLACK;
  ctx.lineWidth = 2;
  if (isHit) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 8; }

  switch (e.drawStyle) {
    case 'square':
      ctx.fillRect(-s/2, -s/2, s, s); ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.fillStyle = color;
      if (!isFrozen) { ctx.fillRect(-3, -3, 2, 2); ctx.fillRect(1, -3, 2, 2); }
      break;
    case 'tank':
      ctx.fillRect(-s/2, -s/2 + 2, s, s - 4); ctx.strokeRect(-s/2, -s/2 + 2, s, s - 4);
      ctx.strokeRect(-s/2 - 2, -s/2 + 4, s + 4, s - 8);
      ctx.fillStyle = color;
      ctx.fillRect(-s/2 + 2, -1, 2, 2); ctx.fillRect(s/2 - 4, -1, 2, 2);
      ctx.strokeStyle = color;
      ctx.beginPath(); ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0); ctx.stroke();
      break;
    case 'triangle':
      ctx.beginPath(); ctx.moveTo(s/2, 0); ctx.lineTo(-s/2, -s/2); ctx.lineTo(-s/2, s/2);
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'arrow':
      ctx.beginPath(); ctx.moveTo(s/2, 0); ctx.lineTo(-s/2, -s/2);
      ctx.lineTo(-s/4, 0); ctx.lineTo(-s/2, s/2);
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'diamond':
      ctx.beginPath(); ctx.moveTo(0, -s/2); ctx.lineTo(s/2, 0);
      ctx.lineTo(0, s/2); ctx.lineTo(-s/2, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'dot':
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, s/2, 0, Math.PI * 2); ctx.fill(); break;
    case 'star':
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI / 4) * i - Math.PI / 2;
        const r = i % 2 === 0 ? s/2 : s/4;
        const px = Math.cos(angle) * r, py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case 'mushroom':
      ctx.fillStyle = isHit ? color : BLACK;
      ctx.fillRect(-3, -s/2 + 4, 6, s/2 + 2);
      ctx.strokeRect(-3, -s/2 + 4, 6, s/2 + 2);
      ctx.beginPath(); ctx.arc(0, -s/2 + 4, s/2, Math.PI, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(-4, -s/2 + 1, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, -s/2 - 1, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -s/2 + 3, 1, 0, Math.PI * 2); ctx.fill();
      break;
    case 'yeti':
      ctx.fillStyle = isHit ? color : BLACK;
      ctx.fillRect(-s/2, -s/2, s, s);
      ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.strokeRect(-s/4, -s/4, s/2, s/2);
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0);
      ctx.moveTo(0, -s/2); ctx.lineTo(0, s/2);
      ctx.moveTo(-s/3, -s/3); ctx.lineTo(s/3, s/3);
      ctx.moveTo(-s/3, s/3); ctx.lineTo(s/3, -s/3);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.fillRect(-4, -4, 2, 2);
      ctx.fillRect(2, -4, 2, 2);
      break;
  }
  ctx.shadowBlur = 0;
  ctx.restore();

  const w = 20, h = 3, bx = e.x - w/2, by = e.y - s/2 - 7;
  ctx.fillStyle = GREEN_DARK; ctx.fillRect(bx, by, w, h);
  const segs = 5;
  const filled = Math.max(0, Math.ceil((e.hp / e.maxHp) * segs));
  ctx.fillStyle = isYeti ? ICE : (isBurning ? FIRE : (isFrozen ? CYAN : (e.type === 'fungo' ? TOXIC : (hordeActive ? RED : GREEN))));
  for (let i = 0; i < filled; i++) {
    const sw = (w / segs) - 1;
    ctx.fillRect(bx + i * (w/segs), by, sw, h);
  }

  // Indicador de queimadura (chama pequena acima)
  if (isBurning) {
    const fy = by - 6 + Math.sin(Date.now() / 100) * 1;
    ctx.fillStyle = FIRE_BRIGHT;
    ctx.shadowColor = FIRE;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(e.x, fy - 4);
    ctx.lineTo(e.x - 3, fy + 2);
    ctx.lineTo(e.x + 3, fy + 2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function startGame(mode) {
  gameMode = mode;
  chosenMap = MAPS[0];
  path = chosenMap.path;
  document.getElementById('mapName').textContent = chosenMap.name;

  document.getElementById('menu').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('titleBar').style.display = 'block';
  document.getElementById('mapInfoBar').style.display = 'block';

  document.body.classList.remove('mode-pc', 'mode-mobile');
  document.body.classList.add('mode-' + mode);

  gold = 100; waveNum = 0; paused = false; gameOver = false;
  playerHp = PLAYER_MAX_HP;
  towers.length = 0; enemies.length = 0; bullets.length = 0;
  missiles.length = 0; explosions.length = 0; particles.length = 0;
  trails.length = 0; texts.length = 0; shockwaves.length = 0;
  sparks.length = 0; heals.length = 0; moneyPops.length = 0;
  healZones.length = 0; flames.length = 0;
  waveQueue = []; waveActive = false; waveDelay = 0; hordeActive = false;
  dragging = null; selectedTowerType = null; pointerDownInfo = null;

  updateUI();
  startWave();
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    startGame(btn.dataset.mode);
  });
});

document.getElementById('btnMenu').addEventListener('click', () => {
  gameMode = null;
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('game').style.display = 'none';
  document.getElementById('titleBar').style.display = 'none';
  document.getElementById('mapInfoBar').style.display = 'none';
  document.body.classList.remove('mode-pc', 'mode-mobile');
});

requestAnimationFrame(loop);
</script>
