<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TOWER DEFENSE 1970 v18</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
  html, body {
    height: 100%; background: #000; color: #33ff33;
    font-family: 'VT323', 'Courier New', monospace;
    overflow: hidden; user-select: none; touch-action: manipulation;
  }
  body { display: flex; justify-content: center; align-items: center; }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px
    );
    pointer-events: none; z-index: 9999; animation: flicker 0.15s infinite;
  }
  body::after {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(51,255,51,0.07), rgba(0,0,0,0.65) 100%);
    pointer-events: none; z-index: 9998;
  }
  @keyframes flicker { 0% { opacity: 0.94; } 50% { opacity: 1; } 100% { opacity: 0.96; } }
  #menu {
    position: fixed; inset: 0; background: #000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 10000; font-family: 'VT323', monospace; gap: 30px; padding: 20px;
  }
  #menu h1 {
    font-size: 52px; color: #33ff33;
    text-shadow: 0 0 20px #33ff33, 0 0 40px #33ff33;
    letter-spacing: 6px; text-align: center;
    animation: titlePulse 2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 20px #33ff33, 0 0 40px #33ff33; }
    50% { text-shadow: 0 0 30px #33ff33, 0 0 60px #33ff33, 0 0 90px #33ff33; }
  }
  #menu .subtitle { color: #22aa22; font-size: 22px; letter-spacing: 6px; margin-top: -30px; }
  #crystalDisplay {
    color: #66ddff; font-size: 26px; letter-spacing: 3px;
    text-shadow: 0 0 10px #66ddff, 0 0 20px #66ddff;
    border: 2px solid #66ddff; padding: 8px 20px;
    background: #000;
    box-shadow: 0 0 15px #66ddff, inset 0 0 10px rgba(102,221,255,0.2);
  }
  .menu-options { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .mode-btn {
    background: #000; border: 3px solid #33ff33; color: #33ff33;
    padding: 20px 30px; font-family: 'VT323', monospace; cursor: pointer;
    text-align: center; min-width: 180px; transition: all 0.15s;
    box-shadow: 0 0 20px #33ff33, inset 0 0 15px rgba(51,255,51,0.2);
    user-select: none; touch-action: manipulation;
  }
  .mode-btn:active, .mode-btn:hover {
    background: #33ff33; color: #000;
    box-shadow: 0 0 40px #33ff33, 0 0 80px #33ff33; transform: scale(1.05);
  }
  .mode-btn:hover .mode-icon, .mode-btn:hover .mode-name, .mode-btn:hover .mode-desc,
  .mode-btn:active .mode-icon, .mode-btn:active .mode-name, .mode-btn:active .mode-desc {
    color: #000; text-shadow: none;
  }
  .mode-btn.cyan { border-color: #66ddff; color: #66ddff; box-shadow: 0 0 20px #66ddff, inset 0 0 15px rgba(102,221,255,0.2); }
  .mode-btn.cyan:hover { background: #66ddff; color: #000; box-shadow: 0 0 40px #66ddff, 0 0 80px #66ddff; }
  .mode-icon { font-size: 50px; margin-bottom: 8px; line-height: 1; }
  .mode-name { font-size: 28px; letter-spacing: 5px; margin-bottom: 6px; text-shadow: 0 0 10px currentColor; }
  .mode-desc { font-size: 14px; letter-spacing: 2px; color: #22aa22; }

  #deckScreen, #upgradeScreen {
    position: fixed; inset: 0; background: #000;
    display: none; flex-direction: column;
    z-index: 10000; font-family: 'VT323', monospace;
    padding: 15px; overflow-y: auto;
  }
  #deckScreen h2, #upgradeScreen h2 {
    font-size: 32px; color: #33ff33;
    text-shadow: 0 0 15px #33ff33;
    letter-spacing: 5px; text-align: center;
    margin-bottom: 5px;
  }
  #upgradeScreen h2 { color: #66ddff; text-shadow: 0 0 15px #66ddff; }
  .deck-info {
    text-align: center; color: #22aa22;
    font-size: 18px; letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .deck-info strong { color: #ffd700; text-shadow: 0 0 8px #ffd700; }
  .deck-info.full strong { color: #33ff33; }
  #upgradeScreen .crystal-total {
    text-align: center; color: #66ddff; font-size: 24px;
    letter-spacing: 3px; margin-bottom: 15px;
    text-shadow: 0 0 10px #66ddff;
  }
  #deckGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px; max-width: 1100px; margin: 0 auto; width: 100%;
  }
  .deck-card {
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    padding: 8px; cursor: pointer;
    font-family: 'VT323', monospace; text-align: left;
    line-height: 1.2; transition: all 0.1s;
    user-select: none; position: relative;
  }
  .deck-card:hover { background: #062a06; }
  .deck-card.selected {
    background: #1a4a1a; border-color: #ffd700;
    box-shadow: 0 0 15px #ffd700, inset 0 0 10px rgba(255,215,0,0.3);
  }
  .deck-card.selected::after {
    content: "✓"; position: absolute; top: 4px; right: 8px;
    color: #ffd700; font-size: 22px; text-shadow: 0 0 8px #ffd700;
  }
  .deck-card .card-name { font-size: 16px; font-weight: bold; margin-bottom: 3px; text-shadow: 0 0 4px #33ff33; }
  .deck-card.selected .card-name { color: #ffd700; text-shadow: 0 0 6px #ffd700; }
  .deck-card .card-cost { font-size: 13px; color: #ffd700; margin-bottom: 4px; }
  .deck-card .card-stat { font-size: 11px; color: #22aa22; }

  /* Upgrade cards */
  #upgradeGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px; max-width: 1100px; margin: 0 auto; width: 100%;
  }
  .upgrade-card {
    background: #000; border: 2px solid #66ddff; color: #66ddff;
    padding: 10px; font-family: 'VT323', monospace; text-align: left;
    line-height: 1.25; position: relative;
  }
  .upgrade-card .u-name {
    font-size: 18px; font-weight: bold; margin-bottom: 5px;
    text-shadow: 0 0 6px #66ddff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .upgrade-card .u-stars {
    font-size: 18px; color: #ffd700;
    text-shadow: 0 0 6px #ffd700;
  }
  .upgrade-card .u-stats {
    font-size: 12px; color: #22aa22;
    margin-bottom: 6px; line-height: 1.4;
  }
  .upgrade-card .u-stats .next { color: #88ff88; }
  .upgrade-card .u-btn {
    width: 100%; padding: 6px; margin-top: 4px;
    background: #000; border: 2px solid #66ddff; color: #66ddff;
    font-family: 'VT323', monospace; font-size: 14px;
    cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 0 8px #66ddff;
    transition: all 0.15s;
  }
  .upgrade-card .u-btn:hover:not(:disabled) {
    background: #66ddff; color: #000; box-shadow: 0 0 20px #66ddff;
  }
  .upgrade-card .u-btn:disabled {
    opacity: 0.35; cursor: not-allowed;
    border-color: #555; color: #555; box-shadow: none;
  }
  .upgrade-card .u-btn.max {
    border-color: #ffd700; color: #ffd700;
    background: #1a1a00;
    cursor: default;
  }
  .upgrade-card .u-btn.max:hover { background: #1a1a00; color: #ffd700; box-shadow: 0 0 8px #ffd700; }

  #deckActions, #upgradeActions {
    display: flex; gap: 15px; justify-content: center;
    margin-top: 15px; flex-wrap: wrap; padding-bottom: 20px;
  }
  .deck-action-btn {
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    padding: 10px 22px; font-family: 'VT323', monospace;
    font-size: 20px; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 0 10px #33ff33; transition: all 0.15s; user-select: none;
  }
  .deck-action-btn:hover:not(:disabled) { background: #33ff33; color: #000; box-shadow: 0 0 25px #33ff33; }
  .deck-action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .deck-action-btn.primary { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 10px #ffd700; }
  .deck-action-btn.primary:hover:not(:disabled) { background: #ffd700; color: #000; box-shadow: 0 0 25px #ffd700; }
  .deck-action-btn.cyan { border-color: #66ddff; color: #66ddff; box-shadow: 0 0 10px #66ddff; }
  .deck-action-btn.cyan:hover:not(:disabled) { background: #66ddff; color: #000; box-shadow: 0 0 25px #66ddff; }

  #soundBtn {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    font-family: 'VT323', monospace; font-size: 14px;
    padding: 4px 10px; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 0 10px #33ff33; z-index: 100; touch-action: manipulation;
    display: none;
  }
  #soundBtn:hover { background: #33ff33; color: #000; }
  #soundBtn.muted { border-color: #ff3333; color: #ff3333; box-shadow: 0 0 10px #ff3333; }
  #soundBtn.muted:hover { background: #ff3333; color: #000; }

  #hordeBanner {
    position: fixed; top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 70px; color: #ff3333;
    text-shadow: 0 0 30px #ff3333, 0 0 60px #ff3333;
    letter-spacing: 8px; z-index: 1500;
    pointer-events: none; opacity: 0;
    font-family: 'VT323', monospace; white-space: nowrap;
  }
  #hordeBanner.show { animation: hordeIntro 2.5s ease-out forwards; }
  #hordeBanner.boss { color: #66ff33; text-shadow: 0 0 40px #66ff33, 0 0 80px #66ff33, 0 0 120px #66ff33; }
  @keyframes hordeIntro {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
  }

  #bossHpBar {
    position: fixed; top: 12px; left: 50%;
    transform: translateX(-50%);
    width: min(85vw, 520px);
    background: #000; border: 3px solid #66ff33;
    box-shadow: 0 0 25px #66ff33, inset 0 0 15px rgba(102,255,51,0.3);
    padding: 6px 10px; display: none; z-index: 1400;
    font-family: 'VT323', monospace;
  }
  #bossHpBar .boss-label {
    font-size: 16px; color: #66ff33;
    text-shadow: 0 0 10px #66ff33;
    letter-spacing: 4px; text-align: center; margin-bottom: 3px;
  }
  #bossHpBar .boss-bar-outer {
    width: 100%; height: 16px; background: #0a1a00;
    border: 1px solid #66ff33; position: relative; overflow: hidden;
  }
  #bossHpBar .boss-bar-inner {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #2a5a1a, #66ff33, #aaff66);
    box-shadow: 0 0 12px #66ff33; transition: width 0.2s linear;
  }
  #bossHpBar .boss-bar-inner.low { animation: hpBlink 0.3s steps(2) infinite; }

  #game { display: flex; gap: 20px; z-index: 10; align-items: flex-start; }
  #ui {
    background: #000; padding: 15px; width: 260px;
    border: 2px solid #33ff33;
    box-shadow: 0 0 20px #33ff33, inset 0 0 10px rgba(51,255,51,0.3);
    font-size: 16px; letter-spacing: 1px;
    max-height: 96vh; overflow-y: auto;
  }
  #ui::-webkit-scrollbar { width: 6px; }
  #ui::-webkit-scrollbar-track { background: #000; }
  #ui::-webkit-scrollbar-thumb { background: #33ff33; }
  h2 {
    font-size: 18px; margin-bottom: 10px; color: #33ff33;
    text-shadow: 0 0 8px #33ff33;
    border-bottom: 1px dashed #33ff33;
    padding-bottom: 5px; letter-spacing: 2px;
  }
  .troops-grid { display: flex; flex-direction: column; gap: 4px; }
  .tower-btn {
    width: 100%; padding: 5px 8px;
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    cursor: grab; text-align: left;
    font-family: 'VT323', monospace; font-size: 14px;
    letter-spacing: 1px; text-shadow: 0 0 4px #33ff33;
    line-height: 1.25; touch-action: none;
    position: relative;
  }
  .tower-btn:hover { background: #33ff33; color: #000; text-shadow: none; }
  .tower-btn:active { cursor: grabbing; }
  .tower-btn.selected {
    background: #33ff33; color: #000; text-shadow: none;
    animation: blink 0.6s steps(2) infinite;
  }
  .tower-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  @keyframes blink {
    0%, 50% { background: #33ff33; }
    51%, 100% { background: #003300; color: #33ff33; }
  }
  .tower-btn .star-badge {
    position: absolute; top: 2px; right: 4px;
    color: #ffd700; font-size: 12px;
    text-shadow: 0 0 4px #ffd700;
  }
  .stat-line { font-size: 11px; color: #22aa22; margin-top: 1px; }
  .cost-line { color: #ffd700; font-weight: bold; }
  .cost-line.expensive { color: #ff3333; }
  #stats {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed #33ff33; font-size: 16px;
  }
  #stats div { margin-bottom: 4px; text-shadow: 0 0 4px #33ff33; }
  #playerHpBox {
    margin-top: 12px; padding: 10px 8px;
    border: 2px solid #33ff33; background: #000;
    box-shadow: 0 0 12px #33ff33, inset 0 0 8px rgba(51,255,51,0.2);
  }
  #playerHpLabel {
    font-size: 16px; letter-spacing: 2px; color: #33ff33;
    text-shadow: 0 0 6px #33ff33; margin-bottom: 5px;
    display: flex; justify-content: space-between;
  }
  #playerHpLabel.low .num { color: #ff3333; text-shadow: 0 0 8px #ff3333; }
  #playerHpBarOuter {
    width: 100%; height: 14px; background: #0a3a0a;
    border: 1px solid #33ff33; position: relative; overflow: hidden;
  }
  #playerHpBarInner {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #1a8a1a, #33ff33);
    box-shadow: 0 0 8px #33ff33;
    transition: width 0.15s linear, background 0.2s;
  }
  #playerHpBarInner.mid { background: linear-gradient(90deg, #8a8a1a, #ffff33); box-shadow: 0 0 8px #ffff33; }
  #playerHpBarInner.low {
    background: linear-gradient(90deg, #8a1a1a, #ff3333);
    box-shadow: 0 0 8px #ff3333;
    animation: hpBlink 0.4s steps(2) infinite;
  }
  @keyframes hpBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.5; } }
  canvas {
    background: #000; border: 2px solid #33ff33;
    box-shadow: 0 0 25px #33ff33, inset 0 0 15px rgba(51,255,51,0.15);
    image-rendering: pixelated; touch-action: none; display: block;
  }
  #msg {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    padding: 10px 24px; font-size: 22px;
    text-shadow: 0 0 8px #33ff33; letter-spacing: 2px;
    display: none; z-index: 1500;
    box-shadow: 0 0 20px #33ff33; white-space: nowrap;
  }
  .title {
    position: fixed; top: 8px; left: 20px;
    font-size: 18px; color: #33ff33;
    text-shadow: 0 0 10px #33ff33; letter-spacing: 3px; z-index: 10;
  }
  .map-info {
    position: fixed; top: 8px; right: 20px;
    font-size: 14px; color: #22aa22;
    letter-spacing: 1px; z-index: 10; text-align: right; line-height: 1.4;
  }
  .map-info .map-name { color: #33ff33; text-shadow: 0 0 6px #33ff33; }
  #btnMenu {
    position: fixed; bottom: 10px; left: 10px;
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    font-family: 'VT323', monospace; font-size: 16px;
    padding: 6px 12px; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 0 10px #33ff33; z-index: 100; touch-action: manipulation;
  }
  #btnMenu:hover { background: #33ff33; color: #000; }
  body.mode-mobile {
    flex-direction: column; justify-content: flex-start;
    align-items: center; padding: 4px; gap: 4px;
  }
  body.mode-mobile #game {
    flex-direction: column; gap: 6px; width: 100%; align-items: center;
  }
  body.mode-mobile canvas {
    width: min(96vw, 96vh, 480px); height: auto; aspect-ratio: 1 / 1;
  }
  body.mode-mobile #ui {
    width: min(96vw, 480px); max-height: 40vh;
    padding: 8px; font-size: 14px; overflow-y: auto;
  }
  body.mode-mobile h2 { font-size: 15px; margin-bottom: 5px; padding-bottom: 3px; }
  body.mode-mobile .troops-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  body.mode-mobile .tower-btn { font-size: 12px; padding: 6px 5px; line-height: 1.15; }
  body.mode-mobile .stat-line { font-size: 9px; }
  body.mode-mobile #playerHpBox { margin-top: 6px; padding: 6px; }
  body.mode-mobile #playerHpLabel { font-size: 14px; }
  body.mode-mobile #playerHpBarOuter { height: 12px; }
  body.mode-mobile #stats { margin-top: 6px; padding-top: 5px; font-size: 14px; }
  body.mode-mobile #stats > div { margin-bottom: 2px; }
  body.mode-mobile #stats .hint { display: none; }
  body.mode-mobile .title { font-size: 13px; top: 4px; left: 8px; letter-spacing: 2px; }
  body.mode-mobile .map-info { font-size: 11px; top: 4px; right: 8px; }
  body.mode-mobile #btnMenu {
    position: static; margin: 6px auto 0 auto; display: block;
    font-size: 14px; padding: 5px 10px;
  }
  body.mode-mobile #soundBtn { top: 26px; font-size: 12px; padding: 3px 8px; }
  body.mode-mobile #hordeBanner { font-size: 44px; }
  body.mode-mobile #msg { font-size: 16px; padding: 8px 16px; }
  body.mode-mobile #deckGrid, body.mode-mobile #upgradeGrid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
  body.mode-mobile .deck-card, body.mode-mobile .upgrade-card { padding: 5px; }
  body.mode-mobile .deck-card .card-name, body.mode-mobile .upgrade-card .u-name { font-size: 12px; }
  body.mode-mobile .deck-card .card-cost { font-size: 10px; }
  body.mode-mobile .deck-card .card-stat, body.mode-mobile .upgrade-card .u-stats { font-size: 9px; }
  body.mode-mobile #deckScreen h2, body.mode-mobile #upgradeScreen h2 { font-size: 22px; }
  body.mode-mobile .deck-action-btn { font-size: 14px; padding: 8px 14px; }
  body.mode-mobile #bossHpBar { width: min(96vw, 480px); top: 42px; padding: 4px 6px; }
  body.mode-mobile #bossHpBar .boss-label { font-size: 13px; }
  body.mode-mobile #bossHpBar .boss-bar-outer { height: 12px; }
</style>
</head>
<body>

<!-- ============ MENU ============ -->
<div id="menu">
  <h1>◄ TOWER DEFENSE ►</h1>
  <div class="subtitle">1 9 7 0</div>
  <div id="crystalDisplay">💎 <span id="menuCrystals">0</span> CRISTAIS</div>
  <div class="menu-options">
    <button class="mode-btn" data-mode="pc">
      <div class="mode-icon">🖥️</div>
      <div class="mode-name">PC</div>
      <div class="mode-desc">MOUSE · TECLADO</div>
    </button>
    <button class="mode-btn" data-mode="mobile">
      <div class="mode-icon">📱</div>
      <div class="mode-name">MOBILE</div>
      <div class="mode-desc">TOQUE · ARRASTE</div>
    </button>
    <button class="mode-btn cyan" id="btnOpenUpgrade">
      <div class="mode-icon">⭐</div>
      <div class="mode-name">APRIMORAR</div>
      <div class="mode-desc">GASTE CRISTAIS</div>
    </button>
  </div>
</div>

<!-- ============ DECK SCREEN ============ -->
<div id="deckScreen">
  <h2>◄ ESCOLHA SEU DECK ►</h2>
  <div class="deck-info" id="deckInfo">
    SELECIONADAS: <strong id="deckCount">0</strong> / <strong>8</strong>
  </div>
  <div id="deckGrid"></div>
  <div id="deckActions">
    <button class="deck-action-btn" id="btnDeckDefault">DECK PADRÃO</button>
    <button class="deck-action-btn" id="btnDeckClear">LIMPAR</button>
    <button class="deck-action-btn" id="btnDeckBack">◄ MENU</button>
    <button class="deck-action-btn primary" id="btnDeckStart" disabled>COMEÇAR ►</button>
  </div>
</div>

<!-- ============ UPGRADE SCREEN ============ -->
<div id="upgradeScreen">
  <h2>⭐ APRIMORAMENTO ⭐</h2>
  <div class="crystal-total">💎 <span id="upgradeCrystals">0</span> CRISTAIS DISPONÍVEIS</div>
  <div id="upgradeGrid"></div>
  <div id="upgradeActions">
    <button class="deck-action-btn cyan" id="btnUpgradeBack">◄ MENU</button>
  </div>
</div>

<div class="title" id="titleBar" style="display:none;">◄ TOWER DEFENSE · v18 ►</div>
<div class="map-info" id="mapInfoBar" style="display:none;">
  MAPA: <span class="map-name" id="mapName">---</span><br>
  30m × 30m · 1m = 16px<br>
  <span id="hordeIndicator"></span>
</div>
<div id="msg"></div>
<button id="soundBtn" title="Ligar/Desligar som">🔊 SOM: ON</button>
<div id="hordeBanner">⚠ HORDA ⚠</div>

<div id="bossHpBar">
  <div class="boss-label">👹 OGRO</div>
  <div class="boss-bar-outer">
    <div class="boss-bar-inner" id="bossBarInner"></div>
  </div>

const Sound = (() => {
  let audioCtx = null;
  let muted = false;
  let masterGain = null;
  function init() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
    } catch(e) {}
  }
  function resume() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function tone(freq, duration, type = 'square', volume = 0.3, freqEnd = null) {
    if (!audioCtx || muted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + duration);
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(now); osc.stop(now + duration);
  }
  function noise(duration, volume = 0.2, filterFreq = 1000) {
    if (!audioCtx || muted) return;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    noiseSource.connect(filter); filter.connect(gain); gain.connect(masterGain);
    noiseSource.start(now); noiseSource.stop(now + duration);
  }
  return {
    init, resume,
    toggle() { muted = !muted; return muted; },
    isMuted() { return muted; },
    shootRecruta() { tone(800, 0.05, 'square', 0.15, 400); },
    shootMetralhadora() { tone(1200, 0.02, 'square', 0.12, 800); },
    shootSniper() { tone(200, 0.15, 'sawtooth', 0.18, 1500); },
    shootFaca() { tone(600, 0.04, 'square', 0.18, 900); },
    shootBoxer() { tone(150, 0.06, 'triangle', 0.2, 80); },
    shootTesla() { tone(300, 0.1, 'sawtooth', 0.15, 600); },
    shootGlacial() { tone(1400, 0.06, 'sine', 0.15, 1800); },
    shootLanca() { noise(0.1, 0.12, 800); },
    shootDrone() { tone(1600, 0.04, 'sine', 0.12, 2000); },
    fireBazuca() { tone(100, 0.25, 'sawtooth', 0.2, 40); noise(0.2, 0.15, 400); },
    explosion() { noise(0.35, 0.25, 600); tone(60, 0.35, 'sawtooth', 0.2, 20); },
    bigExplosion() { noise(0.6, 0.35, 500); tone(40, 0.6, 'sawtooth', 0.3, 10); },
    ogroPound() { noise(0.4, 0.4, 300); tone(50, 0.5, 'square', 0.3, 15); },
    enemyHit() { tone(400, 0.03, 'square', 0.08, 200); },
    enemyDeath() { tone(300, 0.08, 'square', 0.15, 100); },
    playerHit() { tone(200, 0.3, 'sawtooth', 0.3, 60); noise(0.2, 0.2, 400); },
    heal() { tone(500, 0.2, 'sine', 0.2, 900); },
    placeTower() { tone(700, 0.1, 'square', 0.2, 1000); tone(1000, 0.1, 'square', 0.15, 1400); },
    coin() { tone(800, 0.08, 'square', 0.2, 1200); tone(1200, 0.08, 'square', 0.15, 1600); },
    newWave() { tone(400, 0.1, 'square', 0.15); setTimeout(() => tone(600, 0.1, 'square', 0.15), 100); setTimeout(() => tone(800, 0.15, 'square', 0.2), 200); },
    bossAlert() { tone(80, 0.3, 'sawtooth', 0.3, 40); setTimeout(() => tone(60, 0.3, 'sawtooth', 0.3, 30), 350); setTimeout(() => tone(40, 0.5, 'sawtooth', 0.35, 20), 700); },
    gameOver() { tone(400, 0.4, 'square', 0.3, 200); setTimeout(() => tone(200, 0.4, 'square', 0.3, 100), 400); setTimeout(() => tone(100, 0.8, 'square', 0.3, 40), 800); },
    error() { tone(150, 0.15, 'square', 0.2, 100); },
    select() { tone(1000, 0.03, 'square', 0.1); },
    upgrade() { tone(600, 0.08, 'square', 0.15, 900); setTimeout(() => tone(900, 0.08, 'square', 0.15, 1200), 80); setTimeout(() => tone(1200, 0.1, 'square', 0.2, 1600), 160); },
    crystal() { tone(1500, 0.05, 'sine', 0.2, 2000); setTimeout(() => tone(2000, 0.08, 'sine', 0.2, 2400), 60); setTimeout(() => tone(2400, 0.1, 'sine', 0.15, 2800), 130); }
  };
})();

function getWaveComposition(wave) {
  const comp = [];
  for (const type of Object.keys(UNLOCK_WAVE)) {
    if (wave < UNLOCK_WAVE[type]) continue;
    let count = 0;
    switch (type) {
      case 'padrao':    count = 3 + Math.floor(wave * 0.7); break;
      case 'ofensivo':  count = 1 + Math.floor(wave * 0.3); break;
      case 'velocista': count = 2 + Math.floor(wave * 0.4); break;
      case 'aereo':     count = 1 + Math.floor(wave * 0.35); break;
      case 'blindado':  count = 1 + Math.floor(wave * 0.25); break;
      case 'explosivo': count = 1 + Math.floor(wave * 0.25); break;
      case 'fungo':     count = 1 + Math.floor(wave * 0.2); break;
      case 'clone':     count = 1 + Math.floor(wave * 0.2); break;
      case 'yeti':      count = 1 + Math.floor(wave * 0.15); break;
    }
    comp.push({ type, count });
  }
  const queue = [];
  for (const { type, count } of comp) for (let i = 0; i < count; i++) queue.push(type);
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

function isBossWave(wave) { return wave > 0 && wave % 10 === 0; }
function getBossHp(wave) { return Math.floor(5000 * Math.pow(1.5, (wave / 10) - 1)); }
function getBossDamage(wave) { return Math.floor(200 * Math.pow(1.2, (wave / 10) - 1)); }
function getBossCrystalReward(wave) { return 10 + (Math.floor(wave / 10) - 1) * 20; }

function distToSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = a.x + t*dx, py = a.y + t*dy;
  return Math.hypot(p.x-px, p.y-py);
}
function isOnPath(x, y) {
  for (let i = 0; i < path.length - 1; i++) {
    if (distToSegment({x,y}, path[i], path[i+1]) < pathWidth/2 + 12) return true;
  }
  return false;
}
function isValidPlacement(x, y, type) {
  if (x < 14 || y < 14 || x > canvas.width - 14 || y > canvas.height - 14) return false;
  if (isOnPath(x, y)) return false;
  if (towers.some(t => Math.hypot(t.x-x, t.y-y) < 30)) return false;
  if (gold < getCostForType(type)) return false;
  return true;
}

function addParticle(x, y, opts = {}) {
  particles.push({
    x, y,
    vx: opts.vx !== undefined ? opts.vx : (Math.random() - 0.5) * 3,
    vy: opts.vy !== undefined ? opts.vy : (Math.random() - 0.5) * 3,
    life: opts.life || 30, maxLife: opts.life || 30,
    size: opts.size || 2, color: opts.color || GREEN,
    gravity: opts.gravity || 0,
    friction: opts.friction !== undefined ? opts.friction : 0.96
  });
}
function burst(x, y, count, opts = {}) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (opts.speed || 3) * (0.3 + Math.random() * 0.7);
    addParticle(x, y, {
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: opts.life || 25, size: opts.size || 2,
      color: opts.color || GREEN, gravity: opts.gravity || 0,
      friction: opts.friction || 0.94
    });
  }
}
function addTrail(x, y, color, size, life) {
  trails.push({ x, y, life: life || 12, maxLife: life || 12, color: color || GREEN, size: size || 3 });

  if (healed > 0) {
    addFlash(0.2, '51,255,51');

function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('wave').textContent = waveNum;
  document.getElementById('playerHpNum').textContent = playerHp;

  const pct = playerHp / PLAYER_MAX_HP;
  const bar = document.getElementById('playerHpBarInner');
  const lbl = document.getElementById('playerHpLabel');
  bar.style.width = (pct * 100) + '%';
  bar.classList.remove('mid', 'low'); lbl.classList.remove('low');
  if (pct <= 0.25) { bar.classList.add('low'); lbl.classList.add('low'); }
  else if (pct <= 0.5) { bar.classList.add('mid'); }

  const hordeInd = document.getElementById('hordeIndicator');
  if (bossActive) hordeInd.textContent = '👹 OGRO ATIVO';
  else if (waveNum > 0 && (waveNum + 1) % 10 === 0) hordeInd.textContent = 'PRÓXIMA: OGRO';
  else hordeInd.textContent = '';

  document.querySelectorAll('.tower-btn').forEach(btn => {
    const type = btn.dataset.type;
    const cost = getCostForType(type);
    const costEl = btn.querySelector('.cost-line');
    if (costEl) {
      costEl.textContent = cost;
      costEl.classList.toggle('expensive', gold < cost);
    }
    btn.disabled = gold < cost;
    const starBadge = btn.querySelector('.star-badge');
    if (starBadge) {
      const lvl = stars[type] || 0;
      starBadge.textContent = lvl > 0 ? '⭐'.repeat(lvl) : '';
    }
  });

  const bossBar = document.getElementById('bossHpBar');
  if (bossRef && bossActive && enemies.indexOf(bossRef) !== -1) {
    bossBar.style.display = 'block';
    const bp = Math.max(0, bossRef.hp / bossRef.maxHp);
    const inner = document.getElementById('bossBarInner');
    inner.style.width = (bp * 100) + '%';
    inner.classList.toggle('low', bp < 0.3);
  } else {
    bossBar.style.display = 'none';
  }
}
function clearSelection() {

function selectTowerType(type) {

function tryPlace(x, y, type) {
  if (!isValidPlacement(x, y, type)) {
    if (isOnPath(x, y)) showMsg('> ÁREA BLOQUEADA');
    else if (towers.some(t => Math.hypot(t.x-x, t.y-y) < 30)) showMsg('> MUITO PRÓXIMO');
    else if (gold < getCostForType(type)) showMsg('> CRÉDITOS INSUFICIENTES');
    Sound.error();
    return false;
  }
  const def = TOWER_TYPES[type];
  const actualCost = getCostForType(type);
  const stats = getTowerStats(type);
  const lvl = stars[type] || 0;
  towers.push({
    x, y, type,
    cost: actualCost,
    starLevel: lvl,
    range: stats.range, damage: stats.damage,
    fireRate: stats.fireRate, splash: stats.splash,
    heal: stats.heal, isHealer: def.isHealer || false,
    income: stats.income, isMerchant: def.isMerchant || false,
    isFlamethrower: def.isFlamethrower || false,
    isGlacial: def.isGlacial || false,
    isTesla: def.isTesla || false,
    isDefensor: def.isDefensor || false,
    isParadox: def.isParadox || false,
    isBoxer: def.isBoxer || false,
    isDrone: def.isDrone || false,
    hitsAir: def.hitsAir || false,
    chainRange: stats.chainRange,
    maxChains: stats.maxChains,
    fireDmg: stats.fireDmg,
    fireDur: stats.fireDur,
    iceDur: stats.iceDur,
    duration: stats.duration,
    reduction: stats.reduction,
    hp: stats.hp, maxHp: stats.maxHp,
    cooldown: 0, angle: 0,
    spawnAnim: 20, recoil: 0, healPulse: 0, incomePulse: 0,
    defensorPulse: 0, punchAnim: 0,
    droneRotorAngle: 0,
    merchantCrystalTimer: 0
  });
  gold -= actualCost;
  const col = def.isHealer ? GREEN_BRIGHT : def.isMerchant ? GOLD : def.isGlacial ? ICE : def.isTesla ? TESLA : def.isDefensor ? SHIELD : def.isParadox ? PURPLE : def.isFlamethrower ? FIRE : def.isBoxer ? BOXER : def.isDrone ? DRONE : GREEN;
  addShockwave(x, y, col, 40, 22);
  burst(x, y, 16, { speed: 3, life: 25, color: col, size: 2 });
  addFlash(0.15);

  updateUI();

document.addEventListener('pointermove', e => {
  if (pointerDownInfo && pointerDownInfo.source === 'button' && !dragging) {
    const dx = e.clientX - pointerDownInfo.x;
    const dy = e.clientY - pointerDownInfo.y;
    if (Math.hypot(dx, dy) > 8) {
      const type = pointerDownInfo.type;
      dragging = { type, def: TOWER_TYPES[type], x: 0, y: 0, valid: false, overCanvas: false };
      canvas.style.cursor = 'grabbing';
      selectTowerType(type);
    }
  }
  if (dragging) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
    dragging.overCanvas = (cx >= 0 && cx <= canvas.width && cy >= 0 && cy <= canvas.height);
    dragging.x = cx; dragging.y = cy;
    dragging.valid = dragging.overCanvas && isValidPlacement(cx, cy, dragging.type);
  }
});

document.addEventListener('pointerup', e => {
  if (dragging) {
    const d = dragging; dragging = null;
    canvas.style.cursor = 'crosshair';
    if (d.overCanvas) {
      const ok = tryPlace(d.x, d.y, d.type);
      if (ok) clearSelection(); else selectTowerType(d.type);
    } else selectTowerType(d.type);
    pointerDownInfo = null; return;
  }
  if (pointerDownInfo && pointerDownInfo.source === 'button') {
    const moved = Math.hypot(e.clientX - pointerDownInfo.x, e.clientY - pointerDownInfo.y);
    if (moved < 8) {
      const type = pointerDownInfo.type;
      if (selectedTowerType === type) clearSelection();
      else { selectTowerType(type); Sound.select(); }
    }
    pointerDownInfo = null;
  }
});

canvas.addEventListener('pointerdown', e => {
  if (dragging) return;
  if (!selectedTowerType) return;
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
  const ok = tryPlace(cx, cy, selectedTowerType);
  if (ok) clearSelection();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') clearSelection();
  if (e.code === 'Space') {
    e.preventDefault();
    if (!gameOver && gameMode) paused = !paused;
  }
});

function clearFieldForBoss() {
  let crystalBonus = 0;
  let goldBonus = 0;
  const toRemove = [...enemies];
  for (const e of toRemove) {
    if (e.isBoss) continue; // não remove o próprio boss
    const idx = enemies.indexOf(e);
    if (idx === -1) continue;
    // Ouro 10% (floor)
    goldBonus += Math.floor(e.reward * 0.1);
    // Explosão visual
    burst(e.x, e.y - (e.airHeight || 0), 12, { speed: 5, life: 25, size: 3, color: OGRE });
    addShockwave(e.x, e.y - (e.airHeight || 0), OGRE, 30, 18);
    // Remove SEM disparar onDeath
    enemies.splice(idx, 1);
  }
  gold += goldBonus;
  if (goldBonus > 0) {
    addText(canvas.width / 2, canvas.height / 2 - 40, 'LIMPEZA! +' + goldBonus + ' ouro', GOLD, 90, 26);
  }
  Sound.bigExplosion();
  addFlash(0.5, '102,255,51');
  addShake(10);
  updateUI();
}

function spawnEnemy(typeKey, x, y, wp, overrideHp, overrideDmg) {
  const t = ENEMY_TYPES[typeKey];
  const hpScale = 1 + (waveNum - 1) * 0.15;
  const hp = overrideHp !== undefined ? overrideHp : Math.floor(t.hp * (t.isBoss ? 1 : hpScale));
  const dmg = overrideDmg !== undefined ? overrideDmg : t.damage;
  const ex = x !== undefined ? x : path[0].x;
  const ey = y !== undefined ? y : path[0].y;
  let startWp = wp !== undefined ? wp : 1;
  if (startWp < 1) startWp = 1;
  if (startWp >= path.length) startWp = path.length - 1;

  const enemy = {
    type: typeKey, x: ex, y: ey, wp: startWp,
    hp, maxHp: hp, damage: dmg,
    speed: speedToPixels(t.speed), baseSpeed: speedToPixels(t.speed),
    frozen: 0, iceFrozen: 0,
    reward: t.reward,
    size: t.size, armor: t.armor || 0,
    drawStyle: t.drawStyle, onDeath: t.onDeath || null,
    aura: t.aura || 0,
    isAir: t.isAir || false,
    airHeight: t.airHeight || 0,
    airBob: Math.random() * Math.PI * 2,
    airPropTimer: 0,
    fireTimer: 0, fireTickTimer: 0,
    spawnAnim: t.isBoss ? 40 : 15, hitFlash: 0, lastTrailTime: 0, lastHealTick: 0,
    isBoss: t.isBoss || false,
    stepTimer: 0, crackLevel: 0,
    lastPoundHp: hp, poundThreshold: 1000
  };
  enemies.push(enemy);
  if (t.isBoss) {
    bossActive = true; bossRef = enemy;
    addShockwave(ex, ey, OGRE, 120, 45);
    addShockwave(ex, ey, OGRE_DARK, 180, 60);
    burst(ex, ey, 50, { speed: 6, life: 40, size: 4, color: OGRE });
    addFlash(0.5, '102,255,51');
    addShake(12);
    Sound.bossAlert();
  } else if (t.isAir) {
    addShockwave(ex, ey - t.airHeight, AIR, 25, 15);
    burst(ex, ey - t.airHeight, 10, { speed: 2.5, life: 20, size: 2, color: AIR });
  } else {
    addShockwave(ex, ey, GREEN, 20, 12);
    burst(ex, ey, 6, { speed: 1.5, life: 15, size: 1.5 });
  }
}

function startWave() {
  waveNum++;
  bossActive = false; bossRef = null;

  if (isBossWave(waveNum)) {
    waveQueue = []; waveActive = true;
    showBanner('👹 OGRO 👹', true);

    const dmg = getBossDamage(waveNum);
