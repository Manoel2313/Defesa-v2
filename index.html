<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TOWER DEFENSE 1970 v4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  html, body {
    height: 100%;
    background: #000;
    color: #33ff33;
    font-family: 'VT323', 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px
    );
    pointer-events: none; z-index: 999;
    animation: flicker 0.15s infinite;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(51,255,51,0.07), rgba(0,0,0,0.65) 100%);
    pointer-events: none; z-index: 998;
  }
  @keyframes flicker {
    0% { opacity: 0.94; } 50% { opacity: 1; } 100% { opacity: 0.96; }
  }

  #game { display: flex; gap: 20px; z-index: 10; }

  #ui {
    background: #000; padding: 15px; width: 240px;
    border: 2px solid #33ff33;
    box-shadow: 0 0 20px #33ff33, inset 0 0 10px rgba(51,255,51,0.3);
    font-size: 16px; letter-spacing: 1px;
  }

  h2 {
    font-size: 18px; margin-bottom: 10px; color: #33ff33;
    text-shadow: 0 0 8px #33ff33;
    border-bottom: 1px dashed #33ff33;
    padding-bottom: 5px; letter-spacing: 2px;
  }

  .tower-btn {
    width: 100%; padding: 6px 8px; margin-bottom: 5px;
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    cursor: pointer; text-align: left;
    font-family: 'VT323', monospace; font-size: 14px;
    letter-spacing: 1px; text-shadow: 0 0 4px #33ff33;
    line-height: 1.3;
  }
  .tower-btn:hover { background: #33ff33; color: #000; text-shadow: none; }
  .tower-btn.selected {
    background: #33ff33; color: #000; text-shadow: none;
    animation: blink 0.6s steps(2) infinite;
  }
  .tower-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  @keyframes blink {
    0%, 50% { background: #33ff33; }
    51%, 100% { background: #003300; color: #33ff33; }
  }

  .stat-line {
    font-size: 12px; color: #22aa22; margin-top: 2px;
  }

  #stats {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed #33ff33; font-size: 16px;
  }
  #stats div { margin-bottom: 4px; text-shadow: 0 0 4px #33ff33; }

  canvas {
    background: #000;
    border: 2px solid #33ff33;
    box-shadow: 0 0 25px #33ff33, inset 0 0 15px rgba(51,255,51,0.15);
    cursor: crosshair; image-rendering: pixelated;
  }

  #msg {
    position: fixed; top: 30px; left: 50%;
    transform: translateX(-50%);
    background: #000; border: 2px solid #33ff33; color: #33ff33;
    padding: 10px 24px; font-size: 22px;
    text-shadow: 0 0 8px #33ff33; letter-spacing: 2px;
    display: none; z-index: 1000;
    box-shadow: 0 0 20px #33ff33;
  }

  .title {
    position: fixed; top: 8px; left: 20px;
    font-size: 18px; color: #33ff33;
    text-shadow: 0 0 10px #33ff33; letter-spacing: 3px; z-index: 10;
  }
  .scale-info {
    position: fixed; top: 8px; right: 20px;
    font-size: 14px; color: #22aa22;
    letter-spacing: 1px; z-index: 10;
  }
</style>
</head>
<body>
<div class="title">◄ TOWER DEFENSE · 1970 · v4 ►</div>
<div class="scale-info">30m × 30m · 1m = 16px</div>
<div id="msg"></div>
<div id="game">
  <canvas id="canvas" width="480" height="480"></canvas>
  <div id="ui">
    <h2>[ TROPAS ]</h2>
    <button class="tower-btn" data-type="recruta">
      ▪ RECRUTA · 50
      <div class="stat-line">HP 100 · DMG 25 · 1s · 5m</div>
    </button>
    <button class="tower-btn" data-type="sniper">
      ▪ SNIPER · 100
      <div class="stat-line">HP 70 · DMG 25 · 2s · 15m</div>
    </button>
    <button class="tower-btn" data-type="faca">
      ▪ FACA · 75
      <div class="stat-line">HP 130 · DMG 80 · 0.5s · 1m</div>
    </button>
    <div id="stats">
      <div>CRÉDITOS: <span id="gold">200</span></div>
      <div>ONDA: <span id="wave">0</span></div>
      <div style="margin-top:8px;font-size:12px;color:#22aa22;">
        > SELECIONE TROPA<br>
        > CLIQUE NO MAPA<br>
        > [ESPAÇO] PAUSAR
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const PIXELS_PER_METER = 16;
const MAP_SIZE_METERS = 30;

const GREEN = '#33ff33';
const GREEN_BRIGHT = '#88ff88';
const GREEN_DIM = '#1a8a1a';
const GREEN_DARK = '#0a3a0a';
const BLACK = '#000000';
const YELLOW = '#ffff33';
const CYAN = '#33ffff';

const path = [
  {x: 0, y: 64}, {x: 120, y: 64}, {x: 120, y: 180},
  {x: 300, y: 180}, {x: 300, y: 90}, {x: 420, y: 90},
  {x: 420, y: 300}, {x: 150, y: 300}, {x: 150, y: 240},
  {x: 480, y: 240}
];
const pathWidth = 32;

let gold = 200;
let waveNum = 0;
let selectedTower = null;
let paused = false;
let gameOver = false;

const towers = [];
const enemies = [];
const bullets = [];
const explosions = [];
const particles = [];
const trails = [];
const texts = [];        // números flutuantes de dano
const shockwaves = [];   // ondas de choque
const sparks = [];       // faíscas rápidas

// Screen shake
let shakeAmount = 0;
let shakeDecay = 0.9;

// Flash da tela (dano, explosão)
let screenFlash = 0;

const TOWER_TYPES = {
  recruta: { cost: 50,  range: 5 * PIXELS_PER_METER,  damage: 25, fireRate: 60,  hp: 100, maxHp: 100 },
  sniper:  { cost: 100, range: 15 * PIXELS_PER_METER, damage: 25, fireRate: 120, hp: 70,  maxHp: 70  },
  faca:    { cost: 75,  range: 1 * PIXELS_PER_METER,  damage: 80, fireRate: 30,  hp: 130, maxHp: 130 }
};

function speedToPixels(vel) {
  const mps = vel / 20;
  return (mps * PIXELS_PER_METER) / 60;
}

const ENEMY_TYPES = {
  padrao:    { hp: 100, damage: 50,  speed: 100, size: 14, reward: 12, drawStyle: 'square' },
  blindado:  { hp: 500, damage: 50,  speed: 70,  size: 18, reward: 30, armor: 5, drawStyle: 'tank' },
  ofensivo:  { hp: 90,  damage: 150, speed: 90,  size: 14, reward: 20, drawStyle: 'triangle' },
  velocista: { hp: 70,  damage: 30,  speed: 200, size: 11, reward: 15, drawStyle: 'arrow' },
  clone:     { hp: 120, damage: 60,  speed: 120, size: 14, reward: 18, drawStyle: 'diamond', onDeath: 'clone' },
  minion:    { hp: 50,  damage: 10,  speed: 80,  size: 9,  reward: 4,  drawStyle: 'dot' },
  explosivo: { hp: 100, damage: 50,  speed: 100, size: 14, reward: 20, drawStyle: 'star', onDeath: 'explode' }
};

function getWaveComposition(wave) {
  const comp = [];
  comp.push({ type: 'padrao', count: 3 + Math.floor(wave * 0.8) });
  if (wave >= 2) comp.push({ type: 'velocista', count: 2 + Math.floor(wave * 0.5) });
  if (wave >= 3) comp.push({ type: 'ofensivo', count: 1 + Math.floor(wave * 0.4) });
  if (wave >= 4) comp.push({ type: 'explosivo', count: 1 + Math.floor(wave * 0.3) });
  if (wave >= 5) comp.push({ type: 'blindado', count: 1 + Math.floor(wave * 0.3) });
  if (wave >= 6) comp.push({ type: 'clone', count: 1 + Math.floor(wave * 0.25) });

  const queue = [];
  for (const { type, count } of comp) {
    for (let i = 0; i < count; i++) queue.push(type);
  }
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

// ===== SISTEMA DE PARTÍCULAS =====
function addParticle(x, y, opts = {}) {
  particles.push({
    x, y,
    vx: opts.vx !== undefined ? opts.vx : (Math.random() - 0.5) * 3,
    vy: opts.vy !== undefined ? opts.vy : (Math.random() - 0.5) * 3,
    life: opts.life || 30,
    maxLife: opts.life || 30,
    size: opts.size || 2,
    color: opts.color || GREEN,
    gravity: opts.gravity !== undefined ? opts.gravity : 0,
    friction: opts.friction !== undefined ? opts.friction : 0.96,
    shape: opts.shape || 'square'
  });
}

function burst(x, y, count, opts = {}) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (opts.speed || 3) * (0.3 + Math.random() * 0.7);
    addParticle(x, y, {
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: opts.life || 25,
      size: opts.size || 2,
      color: opts.color || GREEN,
      gravity: opts.gravity || 0,
      friction: opts.friction || 0.94
    });
  }
}

function addTrail(x, y, color, size, life) {
  trails.push({
    x, y,
    life: life || 12,
    maxLife: life || 12,
    color: color || GREEN,
    size: size || 3
  });
}

function addShockwave(x, y, color, maxRadius, life) {
  shockwaves.push({
    x, y,
    radius: 2,
    maxRadius: maxRadius || 40,
    life: life || 20,
    maxLife: life || 20,
    color: color || GREEN
  });
}

function addText(x, y, text, color, life) {
  texts.push({
    x, y, text,
    color: color || GREEN,
    life: life || 40,
    maxLife: life || 40,
    vy: -0.8
  });
}

function addSpark(x1, y1, x2, y2, color) {
  sparks.push({
    x1, y1, x2, y2,
    life: 6,
    maxLife: 6,
    color: color || GREEN_BRIGHT
  });
}

function addShake(amount) {
  shakeAmount = Math.min(shakeAmount + amount, 12);
}

function addFlash(amount) {
  screenFlash = Math.min(screenFlash + amount, 0.6);
}

// ===== COLISÃO / UTIL =====
function distToSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = a.x + t*dx, py = a.y + t*dy;
  return Math.hypot(p.x-px, p.y-py);
}

function isOnPath(x, y) {
  for (let i = 0; i < path.length - 1; i++) {
    if (distToSegment({x,y}, path[i], path[i+1]) < pathWidth/2 + 12) return true;
  }
  return false;
}

// ===== UI =====
document.querySelectorAll('.tower-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
    const type = btn.dataset.type;
    if (selectedTower === type) selectedTower = null;
    else { selectedTower = type; btn.classList.add('selected'); }
  });
});

canvas.addEventListener('click', e => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (selectedTower) {
    const def = TOWER_TYPES[selectedTower];
    if (gold < def.cost) { showMsg('> CRÉDITOS INSUFICIENTES'); addShake(2); return; }
    if (isOnPath(x, y)) { showMsg('> ÁREA BLOQUEADA'); addShake(2); return; }
    if (towers.some(t => Math.hypot(t.x-x, t.y-y) < 30)) { showMsg('> MUITO PRÓXIMO'); addShake(2); return; }
    towers.push({
      x, y, type: selectedTower,
      cost: def.cost, range: def.range, damage: def.damage,
      fireRate: def.fireRate,
      hp: def.hp, maxHp: def.hp,
      cooldown: 0, angle: 0,
      spawnAnim: 20,
      recoil: 0
    });
    gold -= def.cost;

    // Efeito de spawn: anel + partículas
    addShockwave(x, y, GREEN, 40, 22);
    burst(x, y, 16, { speed: 3, life: 25, color: GREEN, size: 2 });
    addFlash(0.15);
    updateUI();
  }
});

function showMsg(text) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.style.display = 'block';
  clearTimeout(m._t);
  m._t = setTimeout(() => m.style.display = 'none', 1300);
}

function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('wave').textContent = waveNum;
  document.querySelectorAll('.tower-btn').forEach(btn => {
    btn.disabled = gold < TOWER_TYPES[btn.dataset.type].cost;
  });
}

// ===== SPAWN =====
function spawnEnemy(typeKey, x, y, wp) {
  const t = ENEMY_TYPES[typeKey];
  const hpScale = 1 + (waveNum - 1) * 0.15;
  const hp = Math.floor(t.hp * hpScale);
  const ex = x !== undefined ? x : path[0].x;
  const ey = y !== undefined ? y : path[0].y;

  enemies.push({
    type: typeKey,
    x: ex, y: ey,
    wp: wp !== undefined ? wp : 1,
    hp, maxHp: hp,
    damage: t.damage,
    speed: speedToPixels(t.speed),
    baseSpeed: speedToPixels(t.speed),
    frozen: 0,
    reward: t.reward,
    size: t.size,
    armor: t.armor || 0,
    drawStyle: t.drawStyle,
    onDeath: t.onDeath || null,
    spawnAnim: 15,
    hitFlash: 0,
    lastTrailTime: 0
  });

  // Efeito de spawn
  addShockwave(ex, ey, GREEN, 20, 12);
  burst(ex, ey, 6, { speed: 1.5, life: 15, size: 1.5 });
}

let waveQueue = [];
let spawnCooldown = 0;
let waveDelay = 0;
let waveActive = false;

function startWave() {
  waveNum++;
  waveQueue = getWaveComposition(waveNum);
  spawnCooldown = 0;
  waveActive = true;
  // Aviso visual de nova onda
  addShockwave(240, 240, GREEN, 300, 40);
  addFlash(0.2);
  addShake(3);
  updateUI();
}

function findNearestTower(x, y) {
  let best = null, bestDist = Infinity;
  for (const t of towers) {
    const d = Math.hypot(t.x - x, t.y - y);
    if (d < bestDist) { bestDist = d; best = t; }
  }
  return best;
}

function damageTowerAt(x, y, amount) {
  const t = findNearestTower(x, y);
  if (!t) return;
  t.hp -= amount;

  // Efeito de dano
  addShockwave(t.x, t.y, YELLOW, 30, 18);
  burst(t.x, t.y, 10, { speed: 2.5, life: 20, color: YELLOW, size: 2 });
  addText(t.x, t.y - 15, '-' + amount, YELLOW, 45);
  addFlash(0.25);
  addShake(3);

  if (t.hp <= 0) {
    // Tropa cai: explosão GRANDE
    addShockwave(t.x, t.y, GREEN, 60, 30);
    burst(t.x, t.y, 30, { speed: 5, life: 35, size: 3, gravity: 0.15, friction: 0.93 });
    addFlash(0.4);
    addShake(6);
    const idx = towers.indexOf(t);
    if (idx >= 0) towers.splice(idx, 1);
    showMsg('> TROPA ABATIDA');
  }
  updateUI();
}

function areaExplosion(x, y, damage, radius) {
  // Anel + múltiplas ondas de choque + MUITAS partículas
  addShockwave(x, y, GREEN, radius, 25);
  addShockwave(x, y, YELLOW, radius * 0.6, 18);
  addShockwave(x, y, GREEN, radius * 1.3, 35);
  burst(x, y, 40, { speed: 6, life: 40, size: 3, gravity: 0.2, friction: 0.92 });
  burst(x, y, 20, { speed: 9, life: 25, size: 2, color: YELLOW, friction: 0.9 });
  addFlash(0.5);
  addShake(8);

  const inRange = towers.filter(t => Math.hypot(t.x - x, t.y - y) <= radius);
  for (const t of inRange) {
    t.hp -= damage;
    addText(t.x, t.y - 15, '-' + damage, YELLOW, 45);
    if (t.hp <= 0) {
      addShockwave(t.x, t.y, GREEN, 60, 30);
      burst(t.x, t.y, 30, { speed: 5, life: 35, size: 3 });
      const idx = towers.indexOf(t);
      if (idx >= 0) towers.splice(idx, 1);
    }
  }
  if (inRange.length > 0) {
    showMsg('> EXPLOSÃO 4m');
    updateUI();
  }
}

function spawnCloneMinions(x, y) {
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 / 5) * i;
    const ox = Math.cos(angle) * 16;
    const oy = Math.sin(angle) * 16;
    const wp = findNearestWaypointIndex(x + ox, y + oy);
    spawnEnemy('minion', x + ox, y + oy, wp);
  }
  addShockwave(x, y, CYAN, 40, 22);
  burst(x, y, 20, { speed: 4, life: 30, color: CYAN, size: 2 });
  addFlash(0.2);
}

function findNearestWaypointIndex(x, y) {
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < path.length; i++) {
    const d = Math.hypot(path[i].x - x, path[i].y - y);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return Math.min(best + 1, path.length - 1);
}

function damageEnemy(e, amount, fromX, fromY) {
  const real = Math.max(1, amount - (e.armor || 0));
  e.hp -= real;
  e.hitFlash = 6;

  // Efeito de impacto
  burst(e.x, e.y, 5, { speed: 2, life: 12, size: 1.5, color: GREEN_BRIGHT });
  addText(e.x, e.y - e.size - 5, '-' + real, GREEN_BRIGHT, 30);

  // Faísca da origem até o alvo
  if (fromX !== undefined && fromY !== undefined) {
    addSpark(fromX, fromY, e.x, e.y, GREEN_BRIGHT);
  }
}

// ===== LOOP =====
let lastTime = 0;
function loop(time) {
  requestAnimationFrame(loop);
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;

  if (paused || gameOver) { draw(); return; }

  if (waveActive && waveQueue.length > 0) {
    spawnCooldown -= dt;
    if (spawnCooldown <= 0) {
      spawnEnemy(waveQueue.shift());
      spawnCooldown = 45;
    }
  } else if (waveActive && waveQueue.length === 0 && enemies.length === 0) {
    waveActive = false;
    waveDelay = 90;
  }

  if (waveDelay > 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) startWave();
  }

  // Inimigos
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.spawnAnim > 0) e.spawnAnim -= dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.frozen > 0) { e.frozen -= dt; e.speed = e.baseSpeed * 0.3; }
    else e.speed = e.baseSpeed;

    // Rastro de movimento (a cada N frames)
    e.lastTrailTime -= dt;
    if (e.lastTrailTime <= 0 && e.speed > 0.5) {
      addTrail(e.x, e.y, GREEN, e.size * 0.5, 10);
      e.lastTrailTime = 4;
    }

    const target = path[e.wp];
    if (!target) {
      damageTowerAt(e.x, e.y, e.damage);
      burst(e.x, e.y, 12, { speed: 3, life: 20, size: 2 });
      enemies.splice(i, 1);
      continue;
    }

    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < e.speed * dt) {
      e.x = target.x; e.y = target.y;
      e.wp++;
    } else {
      e.x += (dx/dist) * e.speed * dt;
      e.y += (dy/dist) * e.speed * dt;
    }

    if (e.hp <= 0) {
      gold += e.reward;

      // Efeito de morte
      addShockwave(e.x, e.y, GREEN, 25, 15);
      burst(e.x, e.y, 12, { speed: 3, life: 22, size: 2 });
      addText(e.x, e.y - e.size - 5, '+' + e.reward, YELLOW, 40);

      if (e.onDeath === 'clone') spawnCloneMinions(e.x, e.y);
      else if (e.onDeath === 'explode') areaExplosion(e.x, e.y, 50, 4 * PIXELS_PER_METER);

      enemies.splice(i, 1);
      updateUI();
    }
  }

  // Tropas atiram
  for (const t of towers) {
    if (t.spawnAnim > 0) t.spawnAnim -= dt;
    if (t.recoil > 0) t.recoil -= dt * 3;
    t.cooldown -= dt;

    let target = null, bestDist = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x - t.x, e.y - t.y);
      if (d < t.range && d < bestDist) { bestDist = d; target = e; }
    }
    if (target) {
      t.angle = Math.atan2(target.y - t.y, target.x - t.x);
      if (t.cooldown <= 0) {
        // Muzzle flash
        const muzzleX = t.x + Math.cos(t.angle) * 14;
        const muzzleY = t.y + Math.sin(t.angle) * 14;
        burst(muzzleX, muzzleY, 5, { speed: 2, life: 10, size: 1.5, color: GREEN_BRIGHT });
        addShockwave(muzzleX, muzzleY, GREEN, 8, 8);

        t.recoil = 4;

        bullets.push({
          x: t.x, y: t.y, target,
          damage: t.damage, speed: 8,
          type: t.type,
          angle: t.angle,
          trailTimer: 0
        });
        t.cooldown = t.fireRate;
      }
    }
  }

  // Projéteis
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    // Rastro dos projéteis
    addTrail(b.x, b.y, b.type === 'sniper' ? CYAN : GREEN, b.type === 'faca' ? 3 : 2, 10);

    if (!b.target || b.target.hp <= 0 || enemies.indexOf(b.target) === -1) {
      burst(b.x, b.y, 4, { speed: 1.5, life: 10, size: 1.5 });
      bullets.splice(i, 1); continue;
    }
    if (b.type === 'sniper') {
      // Sniper: hitscan com feixe visual
      damageEnemy(b.target, b.damage, b.x, b.y);
      // Linha de impacto
      addShockwave(b.target.x, b.target.y, CYAN, 15, 10);
      burst(b.target.x, b.target.y, 8, { speed: 3, life: 15, size: 2, color: CYAN });
      addFlash(0.08);
      bullets.splice(i, 1);
      continue;
    }
    const dx = b.target.x - b.x, dy = b.target.y - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist < b.speed * dt) {
      damageEnemy(b.target, b.damage, b.x, b.y);
      if (b.type === 'faca') {
        // Faca: impacto mais brutal
        burst(b.target.x, b.target.y, 12, { speed: 4, life: 18, size: 2.5 });
        addShockwave(b.target.x, b.target.y, GREEN, 18, 12);
        addShake(1.5);
      }
      bullets.splice(i, 1);
    } else {
      b.x += (dx/dist) * b.speed * dt;
      b.y += (dy/dist) * b.speed * dt;
    }
  }

  // Atualiza partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= p.friction;
    p.vy *= p.friction;
    p.vy += p.gravity * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Trails
  for (let i = trails.length - 1; i >= 0; i--) {
    trails[i].life -= dt;
    if (trails[i].life <= 0) trails.splice(i, 1);
  }

  // Shockwaves
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.life -= dt;
    const p = 1 - (s.life / s.maxLife);
    s.radius = s.maxRadius * p;
    if (s.life <= 0) shockwaves.splice(i, 1);
  }

  // Sparks
  for (let i = sparks.length - 1; i >= 0; i--) {
    sparks[i].life -= dt;
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }

  // Textos flutuantes
  for (let i = texts.length - 1; i >= 0; i--) {
    const tx = texts[i];
    tx.y += tx.vy * dt;
    tx.vy *= 0.97;
    tx.life -= dt;
    if (tx.life <= 0) texts.splice(i, 1);
  }

  // Explosões antigas (mantidas para compatibilidade)
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life -= dt;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }

  // Screen shake
  shakeAmount *= shakeDecay;
  if (shakeAmount < 0.1) shakeAmount = 0;

  // Flash
  screenFlash *= 0.88;
  if (screenFlash < 0.01) screenFlash = 0;

  if (towers.length === 0 && enemies.length > 0 && gold < TOWER_TYPES.recruta.cost) {
    gameOver = true;
    showMsg('> TODAS AS TROPAS CAÍRAM <');
  }

  draw();
}

function addExplosion(x, y, radius) {
  explosions.push({ x, y, life: 20, maxLife: 20, radius: radius || 20 });
}

// ===== DESENHO =====
function draw() {
  // Screen shake
  ctx.save();
  if (shakeAmount > 0.1) {
    const sx = (Math.random() - 0.5) * shakeAmount;
    const sy = (Math.random() - 0.5) * shakeAmount;
    ctx.translate(sx, sy);
  }

  ctx.fillStyle = BLACK;
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

  // Grade 1m
  ctx.strokeStyle = 'rgba(51,255,51,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += PIXELS_PER_METER) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += PIXELS_PER_METER) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Grade 5m
  ctx.strokeStyle = 'rgba(51,255,51,0.15)';
  for (let x = 0; x <= canvas.width; x += PIXELS_PER_METER * 5) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += PIXELS_PER_METER * 5) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // ===== CAMINHO (com pulsação) =====
  const pulse = 0.15 + Math.sin(Date.now() / 400) * 0.03;

  ctx.strokeStyle = GREEN;
  ctx.lineWidth = pathWidth;
  ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.stroke();
  ctx.setLineDash([]);

  // ===== TRAILS (atrás de tudo) =====
  for (const tr of trails) {
    const p = tr.life / tr.maxLife;
    ctx.globalAlpha = p * 0.7;
    ctx.fillStyle = tr.color;
    ctx.fillRect(tr.x - tr.size/2, tr.y - tr.size/2, tr.size, tr.size);
  }
  ctx.globalAlpha = 1;

  // ===== TROPAS =====
  for (const t of towers) {
    // Range
    ctx.strokeStyle = 'rgba(51,255,51,0.25)';
    ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    const hpPct = t.hp / t.maxHp;
    const col = hpPct > 0.5 ? GREEN : hpPct > 0.25 ? YELLOW : '#ffaa33';

    // Spawn anim (crescendo)
    let scale = 1;
    if (t.spawnAnim > 0) scale = 0.5 + (1 - t.spawnAnim / 20) * 0.5;

    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.scale(scale, scale);

    // Base quadrada
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(-11, -11, 22, 22);

    // Cantos destacados
    ctx.beginPath();
    ctx.moveTo(-11, -11); ctx.lineTo(-6, -11);
    ctx.moveTo(-11, -11); ctx.lineTo(-11, -6);
    ctx.moveTo(11, -11); ctx.lineTo(6, -11);
    ctx.moveTo(11, -11); ctx.lineTo(11, -6);
    ctx.moveTo(-11, 11); ctx.lineTo(-6, 11);
    ctx.moveTo(-11, 11); ctx.lineTo(-11, 6);
    ctx.moveTo(11, 11); ctx.lineTo(6, 11);
    ctx.moveTo(11, 11); ctx.lineTo(11, 6);
    ctx.stroke();

    // Cano com recuo
    const recoilOffset = t.recoil > 0 ? -t.recoil : 0;
    ctx.rotate(t.angle);
    ctx.fillStyle = col;
    ctx.fillRect(11 + recoilOffset, -2, 12, 4);
    ctx.restore();

    // Símbolo
    ctx.fillStyle = col;
    ctx.font = 'bold 13px VT323, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const sym = t.type === 'recruta' ? 'R' : t.type === 'sniper' ? 'S' : 'F';
    ctx.fillText(sym, t.x, t.y + 1);

    // HP bar com cor dinâmica
    const bw = 26, bh = 3, bx = t.x - bw/2, by = t.y + 15;
    ctx.fillStyle = GREEN_DARK;
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = col;
    ctx.fillRect(bx, by, bw * hpPct, bh);

    // Piscar quando HP baixo
    if (hpPct < 0.3 && Math.floor(Date.now() / 200) % 2 === 0) {
      ctx.strokeStyle = YELLOW;
      ctx.lineWidth = 1;
      ctx.strokeRect(t.x - 13, t.y - 13, 26, 26);
    }
  }

  // ===== SPARKS (faíscas rápidas) =====
  for (const sp of sparks) {
    const p = sp.life / sp.maxLife;
    ctx.strokeStyle = sp.color;
    ctx.globalAlpha = p;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sp.x1, sp.y1); ctx.lineTo(sp.x2, sp.y2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ===== SHOCKWAVES =====
  for (const s of shockwaves) {
    const p = s.life / s.maxLife;
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = p * 0.8;
    ctx.lineWidth = 2 + (1 - p) * 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ===== PROJÉTEIS =====
  for (const b of bullets) {
    if (b.type === 'sniper') {
      // Feixe do sniper
      if (b.target) {
        const grad = ctx.createLinearGradient(b.x, b.y, b.target.x, b.target.y);
        grad.addColorStop(0, 'rgba(51,255,255,0.9)');
        grad.addColorStop(1, 'rgba(51,255,255,0.1)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y); ctx.lineTo(b.target.x, b.target.y);
        ctx.stroke();
      }
    } else {
      // Projétil com brilho pulsante
      const pulse = 0.7 + Math.sin(Date.now() / 60) * 0.3;
      ctx.fillStyle = GREEN_BRIGHT;
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 8 * pulse;
      const s = b.type === 'faca' ? 5 : 3;
      ctx.fillRect(b.x - s/2, b.y - s/2, s, s);
      ctx.shadowBlur = 0;
    }
  }

  // ===== PARTÍCULAS =====
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // ===== EXPLOSÕES (legado) =====
  for (const ex of explosions) {
    const p = 1 - (ex.life / ex.maxLife);
    const r = (ex.radius || 20) * (0.3 + p * 0.7);
    ctx.strokeStyle = GREEN;
    ctx.globalAlpha = ex.life / ex.maxLife;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex.x - r, ex.y); ctx.lineTo(ex.x + r, ex.y);
    ctx.moveTo(ex.x, ex.y - r); ctx.lineTo(ex.x, ex.y + r);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ===== INIMIGOS =====
  for (const e of enemies) drawEnemy(e);

  // ===== TEXTOS FLUTUANTES =====
  for (const tx of texts) {
    const alpha = tx.life / tx.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = tx.color;
    ctx.font = 'bold 14px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = tx.color;
    ctx.shadowBlur = 4;
    ctx.fillText(tx.text, tx.x, tx.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // ===== FLASH DE TELA =====
  if (screenFlash > 0.01) {
    ctx.fillStyle = `rgba(51,255,51,${screenFlash})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // ===== VIGNETTE =====
  const vg = ctx.createRadialGradient(240, 240, 150, 240, 240, 340);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Pausa
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 48px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = GREEN; ctx.shadowBlur = 20;
    ctx.fillText('|| PAUSA ||', canvas.width/2, canvas.height/2);
    ctx.shadowBlur = 0;
  }
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 48px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = GREEN; ctx.shadowBlur = 25;
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
    ctx.font = '28px VT323, monospace';
    ctx.fillText('ONDA ' + waveNum, canvas.width/2, canvas.height/2 + 30);
    ctx.shadowBlur = 0;
  }
}

function drawEnemy(e) {
  const s = e.size;
  const isFrozen = e.frozen > 0;
  const isHit = e.hitFlash > 0;
  let color = isFrozen ? CYAN : (isHit ? '#ffffff' : GREEN);

  // Spawn anim (escala crescendo)
  let scale = 1;
  if (e.spawnAnim > 0) scale = 0.3 + (1 - e.spawnAnim / 15) * 0.7;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(scale, scale);

  ctx.strokeStyle = color;
  ctx.fillStyle = isHit ? color : BLACK;
  ctx.lineWidth = 2;

  // Glow suave
  if (isHit) {
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 8;
  }

  switch (e.drawStyle) {
    case 'square':
      ctx.fillRect(-s/2, -s/2, s, s);
      ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.fillStyle = color;
      if (!isFrozen) {
        ctx.fillRect(-3, -3, 2, 2);
        ctx.fillRect(1, -3, 2, 2);
      }
      break;

    case 'tank':
      ctx.fillRect(-s/2, -s/2 + 2, s, s - 4);
      ctx.strokeRect(-s/2, -s/2 + 2, s, s - 4);
      ctx.strokeRect(-s/2 - 2, -s/2 + 4, s + 4, s - 8);
      ctx.fillStyle = color;
      ctx.fillRect(-s/2 + 2, -1, 2, 2);
      ctx.fillRect(s/2 - 4, -1, 2, 2);
      // Blindagem extra: linhas
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0);
      ctx.stroke();
      break;

    case 'triangle':
      ctx.beginPath();
      ctx.moveTo(s/2, 0);
      ctx.lineTo(-s/2, -s/2);
      ctx.lineTo(-s/2, s/2);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;

    case 'arrow':
      ctx.beginPath();
      ctx.moveTo(s/2, 0);
      ctx.lineTo(-s/2, -s/2);
      ctx.lineTo(-s/4, 0);
      ctx.lineTo(-s/2, s/2);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;

    case 'diamond':
      ctx.beginPath();
      ctx.moveTo(0, -s/2);
      ctx.lineTo(s/2, 0);
      ctx.lineTo(0, s/2);
      ctx.lineTo(-s/2, 0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;

    case 'dot':
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, s/2, 0, Math.PI * 2);
      ctx.fill();
      break;

    case 'star':
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI / 4) * i - Math.PI / 2;
        const r = i % 2 === 0 ? s/2 : s/4;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;
  }
  ctx.shadowBlur = 0;
  ctx.restore();

  // HP bar (fora da transformação pra ficar nítida)
  const w = 20, h = 3;
  const bx = e.x - w/2, by = e.y - s/2 - 7;
  ctx.fillStyle = GREEN_DARK;
  ctx.fillRect(bx, by, w, h);
  const segs = 5;
  const filled = Math.max(0, Math.ceil((e.hp / e.maxHp) * segs));
  ctx.fillStyle = isFrozen ? CYAN : GREEN;
  for (let i = 0; i < filled; i++) {
    const sw = (w / segs) - 1;
    ctx.fillRect(bx + i * (w/segs), by, sw, h);
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!gameOver) paused = !paused;
  }
});

startWave();
requestAnimationFrame(loop);
updateUI();
</script>
</body>
</html>
